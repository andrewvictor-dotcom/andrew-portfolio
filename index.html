/* ===== story case study v2 ===== */
.cover:has(.cv-stage){border-color:transparent;background:transparent}
.cv-stage{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;background:radial-gradient(closest-side at 50% 58%,color-mix(in oklab,var(--pc) 24%,var(--canvas)) 0%,color-mix(in oklab,var(--pc) 10%,var(--canvas)) 55%,var(--canvas) 100%)}
.cv-stage::before{content:"";position:absolute;width:62%;aspect-ratio:1;border-radius:50%;left:50%;top:58%;translate:-50% -50%;background:radial-gradient(circle,color-mix(in oklab,var(--pc) 30%,transparent),transparent 68%);filter:blur(10px);opacity:.7;pointer-events:none}
.cv-stage.opaque{background:var(--cbg,var(--surface))}
.cv-stage.opaque::before{display:none}
.cv-stage.opaque .cv-art{-webkit-mask-image:radial-gradient(ellipse 72% 70% at 50% 50%,#000 58%,transparent 100%);mask-image:radial-gradient(ellipse 72% 70% at 50% 50%,#000 58%,transparent 100%);filter:none}
.cv-art{position:relative;max-width:88%;max-height:86%;width:auto;height:auto;object-fit:contain;filter:drop-shadow(0 28px 36px rgba(16,24,48,.20));transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.card:hover .cv-art{transform:translateY(-8px) scale(1.025)}
.cs .cover{aspect-ratio:16/8.5;margin-top:4px}
.cs .cover .cv-art{max-height:88%;animation:cvFloat 7s ease-in-out infinite}
@keyframes cvFloat{50%{translate:0 -10px}}
@media (max-width:700px){.cs .cover{aspect-ratio:4/3.4}.cv-art{max-width:94%}}

.cs-tag{font-family:var(--display);font-weight:650;font-size:clamp(20px,2.3vw,27px);letter-spacing:-.015em;line-height:1.25;color:var(--pc);margin:16px 0 0;max-width:30ch;text-wrap:balance}
.cs-hero .intro p{font-size:clamp(17px,1.5vw,19px);line-height:1.6;color:var(--muted);max-width:56ch;margin:16px 0 0}
.tldr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:28px}
.tldr>div{border:1px solid var(--line);border-radius:18px;padding:18px 20px;background:var(--surface);display:grid;gap:6px;align-content:start}
.tldr b{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:8px}
.tldr b i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.tldr .t-p b i{background:var(--redline)}
.tldr .t-s b i{background:var(--accent)}
.tldr p{margin:0;font-size:16.5px;line-height:1.45;color:var(--ink)}
.tldr .t-r{background:color-mix(in oklab,var(--pc) 13%,var(--surface));border-color:color-mix(in oklab,var(--pc) 45%,transparent)}
.tldr .t-r b i{background:var(--pc)}
.tldr .t-r p{font-weight:600}
@media (max-width:760px){.tldr{grid-template-columns:1fr}}
.cs.story .facts{margin-top:16px}

/* chapter nav */
.st-nav{position:sticky;top:var(--barh,66px);z-index:2;margin:40px calc(var(--gutter) * -1) 0;padding:10px var(--gutter);background:color-mix(in oklab,var(--canvas) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line-soft)}
.st-nav ol{list-style:none;margin:0 auto;padding:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:var(--maxw)}
.st-nav ol::-webkit-scrollbar{display:none}
.st-nav button{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:7px 13px 7px 8px;font-size:13.5px;font-weight:500;cursor:pointer;transition:all .25s}
.st-nav button span{font-family:var(--mono);font-size:11px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--line-soft);color:var(--muted);transition:all .25s}
.st-nav button.done span{background:color-mix(in oklab,var(--pc) 22%,var(--surface));color:var(--ink)}
.st-nav button.on{background:var(--ink);color:var(--canvas);border-color:var(--ink)}
.st-nav button.on span{background:var(--pc);color:#fff}
.st-nav .bar{position:absolute;left:0;bottom:-1px;height:2px;background:var(--pc);width:var(--prog,0%);transition:width .2s}

/* sections */
.st{padding-top:8px}
.st-sec{padding-block:clamp(48px,7vw,96px);border-top:1px solid var(--line-soft);scroll-margin-top:calc(var(--barh,66px) + 64px)}
.st-sec.cont{border-top:0;padding-top:clamp(28px,4vw,56px)}
.st-eye{display:flex;align-items:center;gap:12px;margin-bottom:18px;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--pc)}
.st-eye b{font-weight:500;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:color-mix(in oklab,var(--pc) 15%,var(--surface));border:1px solid color-mix(in oklab,var(--pc) 35%,transparent)}
.st-eye::after{content:"";flex:1;max-width:120px;height:1px;background:color-mix(in oklab,var(--pc) 40%,transparent)}
.st-body{display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(24px,3.5vw,40px)}
.st-col{min-width:0}
@media (max-width:560px){.st-stats{grid-template-columns:1fr 1fr}}
.st-body.side{grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:clamp(28px,5vw,72px);align-items:start}
.st-body.side>.st-fig{position:sticky;top:calc(var(--barh,66px) + 76px)}
@media (max-width:900px){.st-body.side{grid-template-columns:1fr}.st-body.side>.st-fig{position:static}}
.st-col h2{font-family:var(--display);font-weight:720;font-size:clamp(28px,3.4vw,44px);letter-spacing:-.03em;line-height:1.06;margin:0 0 18px;max-width:20ch;text-wrap:balance}
.st-text{max-width:60ch}
.st-text p{font-size:18px;line-height:1.68;margin:0 0 14px;color:color-mix(in oklab,var(--ink) 88%,var(--muted))}
.st-text p:last-child{margin-bottom:0}
.st-text ul{margin:6px 0 14px;padding:0;list-style:none;display:grid;gap:12px;font-size:17.5px;line-height:1.55}
.st-text li{position:relative;padding-left:22px}
.st-text li::before{content:"";position:absolute;left:2px;top:.62em;width:8px;height:8px;border-radius:3px;background:var(--pc)}
.st-text b{color:var(--ink)}
.st-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:24px;max-width:640px}
.st-stats div{border-radius:16px;padding:16px 18px;background:var(--surface);border:1px solid var(--line-soft);display:grid;gap:4px}
.st-stats b{font-family:var(--display);font-size:clamp(30px,3.4vw,40px);letter-spacing:-.03em;line-height:1;color:var(--pc);font-variant-numeric:tabular-nums}
.st-stats span{color:var(--muted);font-size:14px;line-height:1.4}

/* figures */
.st-fig{margin:0;display:grid;gap:12px;justify-items:center}
.st-frame{position:relative;width:100%;border-radius:24px;padding:clamp(18px,3.4vw,44px);background:radial-gradient(90% 80% at 50% 100%,color-mix(in oklab,var(--pc) 16%,var(--surface)),color-mix(in oklab,var(--pc) 5%,var(--surface)) 70%);border:1px solid var(--line-soft);display:grid;place-items:center;overflow:visible}
.st-shot{position:relative;width:min(100%,calc(var(--mh,560px) * var(--ar,1.4)));cursor:zoom-in;padding:0;border:0;background:none;display:block;-webkit-tap-highlight-color:transparent}
.st-body.below .st-shot{--mh:600px}
.st-shot img.base{display:block;width:100%;height:auto;filter:drop-shadow(0 18px 30px rgba(16,24,48,.16));transition:filter .9s ease,opacity .9s}
.st-fig figcaption{font-size:14.5px;line-height:1.5;color:var(--muted);max-width:64ch;text-align:center}
.fx .lift{position:absolute;z-index:calc(2 + var(--k,0));transition-delay:calc(var(--k,0) * .35s) !important;border-radius:12px;background-repeat:no-repeat;pointer-events:none;transform-origin:50% 50%;transform:perspective(1100px) rotateX(0) rotateY(0) scale(1);box-shadow:0 0 0 0 transparent;transition:transform 1s cubic-bezier(.2,.9,.25,1.15),box-shadow 1s,outline-color .6s;outline:2px solid transparent;outline-offset:3px}
.fx.on .base{filter:blur(2.6px) saturate(.55) brightness(.97) drop-shadow(0 18px 30px rgba(16,24,48,.12));opacity:.7}
.fx.on .lift{transform:perspective(1100px) rotateX(var(--rx,8deg)) rotateY(var(--ry,-10deg)) translateZ(30px) scale(1.1);box-shadow:0 34px 60px -18px rgba(10,14,30,.5),0 10px 20px -10px rgba(10,14,30,.3);outline-color:var(--pc)}
.fx .lift-tag{position:absolute;z-index:6;width:max-content;transform:translate(-4px,calc(-100% - 18px));background:var(--ink);color:var(--canvas);font-size:13px;font-weight:500;line-height:1.3;padding:7px 11px;border-radius:10px 10px 10px 3px;white-space:normal;opacity:0;translate:0 8px;transition:opacity .5s .5s,translate .5s .5s;pointer-events:none;box-shadow:var(--shadow)}
.fx.on .lift-tag{opacity:1;translate:0 0;transition-delay:calc(.5s + var(--k,0) * .35s)}
.fx .lift-tag em{font-style:normal;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--pc);color:#fff;font-size:11px;font-weight:600;margin-right:7px;vertical-align:-1px}
.fx.off .lift{transition-delay:0s !important}
.fe-rect.many{box-shadow:none}
.fe-rect b{position:absolute;left:-2px;top:-2px;translate:0 -100%;background:var(--accent);color:#fff;font:600 11px var(--body);padding:2px 7px;border-radius:5px 5px 0 0}
.fx .lift-tag i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--pc);margin-right:7px;vertical-align:1px}
.fx .lift-tag.end{transform:translate(calc(-100% + 4px),calc(-100% - 18px));border-radius:10px 10px 3px 10px}
.fx .fx-x{position:absolute;right:-13px;top:-13px;width:28px;height:28px;border-radius:50%;border:2px solid var(--surface-2);background:var(--ink);color:var(--canvas);font-size:12px;line-height:1;display:grid;place-items:center;cursor:pointer;pointer-events:none;opacity:0;scale:.4;transition:opacity .3s,scale .35s cubic-bezier(.2,.9,.3,1.4),background .2s;box-shadow:0 6px 16px -4px rgba(0,0,0,.45);padding:0}
.fx.on .fx-x{pointer-events:auto;opacity:1;scale:1;transition-delay:.7s}
.fx .fx-x:hover,.fx .fx-x:focus-visible{background:var(--redline);color:#fff;transition-delay:0s}
.fx .fx-x::after{content:"";position:absolute;inset:-10px}
.fx.off .base{filter:drop-shadow(0 18px 30px rgba(16,24,48,.16));opacity:1}
.fx.off .lift,.fx.off .lift-tag{opacity:0;transition:opacity .35s,transform .6s}
.fx .fx-on{position:absolute;left:50%;bottom:-34px;white-space:nowrap;translate:-50% 8px;z-index:4;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-size:13px;font-weight:500;padding:7px 13px;border-radius:999px;cursor:pointer;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .3s,translate .3s}
.fx .fx-on i{width:8px;height:8px;border-radius:50%;background:var(--pc)}
.fx.off .fx-on{opacity:1;pointer-events:auto;translate:-50% 0}
.fx .fx-on:hover{border-color:var(--ink)}
@media (max-width:700px){.fx .fx-x{width:32px;height:32px;right:-12px;top:-14px}}
@media (max-width:700px){.fx.on .lift{transform:perspective(900px) rotateX(5deg) rotateY(-6deg) translateZ(16px) scale(1.06)}.fx .lift-tag{font-size:12px;white-space:normal;max-width:220px}}
:root[data-theme="dark"] .fx.on .base{filter:blur(2.6px) saturate(.5) brightness(.6)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fx.on .base{filter:blur(2.6px) saturate(.5) brightness(.6)}}

/* compare */
.cmp-wrap{display:grid;gap:12px;justify-items:center;margin-top:8px}
.cmp{position:relative;width:min(100%,calc(var(--mh,340px) * var(--ar,2)));user-select:none;-webkit-user-select:none;touch-action:pan-y}
.cmp img{display:block;width:100%;height:auto;pointer-events:none;filter:drop-shadow(0 16px 26px rgba(16,24,48,.14))}
.cmp-b{position:absolute;inset:0;clip-path:inset(0 calc(100% - var(--p,50%)) 0 0)}
.cmp-h{position:absolute;top:-10px;bottom:-10px;left:var(--p,50%);width:2px;margin-left:-1px;background:var(--pc);pointer-events:none}
.cmp-h span{position:absolute;top:50%;left:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:var(--pc);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px -6px rgba(0,0,0,.4);font-size:16px;letter-spacing:-2px}
.cmp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.cmp{margin-top:36px}
.cmp-l{position:absolute;top:-34px;z-index:2;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:5px 9px;border-radius:7px;pointer-events:none}
.cmp-l.l{left:0;background:var(--ink);color:var(--canvas)}
.cmp-l.r{right:0;background:var(--pc);color:#fff}
.cmp-side{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;width:100%;max-width:1000px}
.cmp-side figure{margin:0;display:grid;gap:10px;align-content:start}
.cmp-side .tag{justify-self:start;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:5px 9px;border-radius:7px;background:var(--ink);color:var(--canvas)}
.cmp-side figure:last-child .tag{background:var(--pc);color:#fff}
.cmp-side img{width:100%;height:auto;filter:drop-shadow(0 14px 24px rgba(16,24,48,.14))}
@media (max-width:700px){.cmp-side{grid-template-columns:1fr}}

/* extended */
.st-ext{margin-top:22px;border:1px solid var(--line);border-radius:14px;background:var(--surface);max-width:62ch;overflow:hidden}
.st-ext summary{cursor:pointer;list-style:none;padding:14px 18px;font-weight:600;font-size:15px;display:flex;align-items:center;gap:10px}
.st-ext summary::-webkit-details-marker{display:none}
.st-ext summary span{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--pc);font-weight:500}
.st-ext summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-3px) rotate(45deg);transition:transform .3s}
.st-ext[open] summary::after{transform:translateY(2px) rotate(225deg)}
.st-ext summary:hover::after{border-color:var(--ink)}
.st-ext .st-text{padding:0 18px 18px}
.st-ext .st-text p,.st-ext .st-text ul{font-size:16px}

/* results, quote */
.st-results{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-top:8px}
.st-results div{border-radius:20px;padding:24px;background:linear-gradient(160deg,color-mix(in oklab,var(--pc) 14%,var(--surface)),var(--surface));border:1px solid color-mix(in oklab,var(--pc) 30%,var(--line-soft));display:grid;gap:8px;align-content:start}
.st-results b{font-family:var(--display);font-size:clamp(40px,5vw,60px);letter-spacing:-.04em;line-height:.95;color:var(--pc);font-variant-numeric:tabular-nums}
.st-results span{color:var(--ink);font-size:15.5px;line-height:1.45}
.st-quote{margin:0;padding-block:clamp(36px,5vw,64px);border-top:1px solid var(--line-soft);font-family:var(--display);font-weight:600;font-size:clamp(24px,3vw,36px);line-height:1.22;letter-spacing:-.02em;max-width:26ch;text-wrap:balance}
.st-quote::before{content:"\201C";display:block;font-size:2.2em;line-height:.6;color:var(--pc);margin-bottom:6px}
.st-quote cite{display:block;margin-top:14px;font-family:var(--body);font-style:normal;font-size:15px;font-weight:400;color:var(--muted);letter-spacing:0}
.st-list{margin:0;padding-left:22px;display:grid;gap:10px;font-size:18px;line-height:1.6;max-width:62ch}
.st-slides{display:flex;justify-content:center;padding-block:8px 32px}
/* focus editor */
.fe-rect{position:absolute;border:2px solid var(--accent);background:color-mix(in oklab,var(--accent) 14%,transparent);border-radius:6px;pointer-events:none;box-shadow:0 0 0 9999px rgba(0,0,0,.35)}

/* ===== extra blocks ===== */
.blk-media{margin-top:8px}
/* charts */
.ch{border:1px solid var(--line-soft);background:var(--surface);border-radius:20px;padding:clamp(18px,3vw,28px);display:grid;gap:14px;max-width:760px}
.ch-t{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ch-row{display:grid;grid-template-columns:minmax(90px,140px) minmax(0,1fr) auto;gap:14px;align-items:center}
.ch-l{font-size:15px;font-weight:500}
.ch-trk{height:16px;border-radius:999px;background:var(--line-soft);overflow:hidden}
.ch-trk i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,color-mix(in oklab,var(--pc) 60%,var(--surface)),var(--pc));transition:width 1.4s cubic-bezier(.2,.8,.2,1) calc(var(--k) * .25s)}
.ch-row.muted .ch-trk i{background:linear-gradient(90deg,color-mix(in oklab,var(--muted) 45%,var(--surface)),var(--muted))}
.ch.on .ch-trk i{width:var(--w)}
.ch-row b{font-family:var(--display);font-size:clamp(22px,2.6vw,30px);letter-spacing:-.02em;min-width:5ch;text-align:right;font-variant-numeric:tabular-nums}
.ch-row b{color:var(--pc)}.ch-row.muted b{color:var(--ink)}
.ch-rings{display:flex;flex-wrap:wrap;gap:clamp(20px,4vw,48px)}
.ch-rings figure{margin:0;position:relative;width:150px;display:grid;justify-items:center;gap:10px;text-align:center}
.ch-rings svg{width:150px;height:150px;transform:rotate(-90deg)}
.ch-rings circle{fill:none;stroke-width:12}
.ch-rings .trk{stroke:var(--line-soft)}
.ch-rings .val{stroke:var(--pc);stroke-linecap:round;stroke-dasharray:0 100;transition:stroke-dasharray 1.6s cubic-bezier(.2,.8,.2,1) calc(var(--k) * .3s)}
.ch-rings figure:nth-child(2) .val{stroke:var(--redline)}
.ch.on .ch-rings .val{stroke-dasharray:var(--p) 100}
.ch-rings b{position:absolute;top:75px;left:50%;translate:-50% -50%;font-family:var(--display);font-size:34px;letter-spacing:-.03em}
.ch-rings figcaption{font-size:14px;color:var(--muted);line-height:1.4}
@media (max-width:560px){.ch-row{grid-template-columns:1fr auto}.ch-trk{grid-column:1/-1;order:3}.ch-rings figure{width:130px}.ch-rings svg{width:130px;height:130px}.ch-rings b{top:65px;font-size:28px}}
/* deck */
.deck{display:grid;gap:12px;outline:none}
.deck-stage{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#0b0c10;box-shadow:0 30px 60px -30px rgba(0,0,0,.5);touch-action:pan-y}
.deck-stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transform:scale(1.02);transition:opacity .5s,transform .6s}
.deck-stage img.on{opacity:1;transform:none}
.deck-nav{position:absolute;top:50%;translate:0 -50%;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.45);color:#fff;font-size:22px;cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(6px);transition:background .2s}
.deck-nav:hover{background:rgba(0,0,0,.75)}
.deck-nav.d-prev{left:12px}.deck-nav.d-next{right:12px}
.deck-full{position:absolute;right:12px;bottom:12px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.5);color:#fff;font-size:13px;padding:6px 11px;border-radius:9px;cursor:pointer}
.deck-bar{display:flex;align-items:center;gap:14px;min-width:0}
.deck-n{color:var(--muted);white-space:nowrap}
.deck-th{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:4px 2px;min-width:0}
.deck-th::-webkit-scrollbar{display:none}
.deck-th button{flex:none;width:96px;aspect-ratio:16/9;border-radius:8px;overflow:hidden;border:2px solid transparent;padding:0;cursor:pointer;opacity:.55;background:#000;transition:opacity .2s,border-color .2s}
.deck-th button.on{opacity:1;border-color:var(--pc)}
.deck-th img{width:100%;height:100%;object-fit:cover}
/* flow (pinned phone) */
.flow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);gap:clamp(24px,5vw,72px);align-items:start}
.fl-step{min-height:62vh;display:grid;grid-template-columns:40px minmax(0,1fr);gap:16px;align-content:center;opacity:.35;transition:opacity .4s}
.fl-step.on{opacity:1}
.fl-n{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-family:var(--mono);background:var(--surface);border:1px solid var(--line);transition:all .3s}
.fl-step.on .fl-n{background:var(--pc);color:#fff;border-color:var(--pc)}
.fl-step h3{margin:4px 0 8px;font-family:var(--display);font-size:clamp(22px,2.4vw,28px);letter-spacing:-.02em}
.fl-step p{margin:0;font-size:17px;line-height:1.6;color:var(--muted);max-width:44ch}
.fl-inline{display:none}
.fl-dev{position:sticky;top:calc(var(--barh,66px) + 90px);display:grid;justify-items:center;gap:14px}
.fl-frame{position:relative;width:min(100%,300px);aspect-ratio:9/19.5;border-radius:38px;background:#0b0c10;padding:10px;box-shadow:0 40px 70px -30px rgba(10,14,30,.55)}
.fl-frame img{position:absolute;inset:10px;width:calc(100% - 20px);height:calc(100% - 20px);object-fit:cover;object-position:top;border-radius:29px;opacity:0;transform:translateY(14px) scale(.98);transition:opacity .5s,transform .6s cubic-bezier(.2,.8,.2,1)}
.fl-frame img.on{opacity:1;transform:none}
.fl-dots{display:flex;gap:6px}.fl-dots i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:all .3s}.fl-dots i.on{width:22px;border-radius:4px;background:var(--pc)}
@media (max-width:900px){.flow{grid-template-columns:1fr}.fl-dev{display:none}.fl-step{min-height:0;opacity:1;padding-block:14px}.fl-inline{display:block;grid-column:2;width:min(100%,260px);border-radius:22px;margin-top:12px;box-shadow:var(--shadow)}}
/* strip */
.strip-row{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x proximity;padding:8px 2px 18px;scrollbar-width:thin}
.strip figure{margin:0;flex:none;scroll-snap-align:start;display:grid;gap:8px}
.strip img{height:clamp(320px,52vh,520px);width:auto;border-radius:18px;filter:drop-shadow(0 18px 28px rgba(16,24,48,.16))}
.strip figcaption{font-size:14px;color:var(--muted)}
/* evolution */
.evo{display:grid;gap:14px}
.evo-tabs{display:flex;gap:8px;flex-wrap:wrap}
.evo-tabs button{position:relative;overflow:hidden;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 16px;font-weight:500;cursor:pointer;color:var(--muted)}
.evo-tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--ink)}
.evo-tabs i{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--pc)}
.evo-tabs button.run i{animation:evoBar 2.6s linear forwards}
@keyframes evoBar{to{width:100%}}
.evo-stage{position:relative;min-height:200px}
.evo-stage img{grid-area:1/1;width:100%;height:auto;max-height:600px;object-fit:contain;opacity:0;transition:opacity .6s;border-radius:12px}
.evo-stage img.on{opacity:1}
.evo-stage{display:grid}
/* bot vs agent */
.ba{display:grid;gap:16px}
.ba-pick{display:flex;flex-wrap:wrap;gap:8px}
.ba-pick button{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer;transition:all .2s}
.ba-pick button[aria-pressed="true"]{background:var(--ink);color:var(--canvas);border-color:var(--ink)}
.ba-panes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.ba-panes{grid-template-columns:1fr}.ba-pane{min-height:0}.ba-log{min-height:220px}}
.zz-chip svg{width:14px;height:14px;flex:none;vertical-align:-2px;margin-right:6px}
.ba-pane{border:1px solid var(--line);border-radius:22px;background:var(--surface);display:grid;grid-template-rows:auto 1fr;min-height:430px;overflow:hidden}
.ba-pane.ba-agent{border-color:color-mix(in oklab,var(--pc) 45%,var(--line));box-shadow:0 30px 60px -36px color-mix(in oklab,var(--pc) 70%,transparent)}
.ba-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.ba-h b{font-family:var(--display);font-size:18px}
.ba-tag{font-family:var(--mono);font-size:11px;padding:4px 8px;border-radius:6px;background:var(--line-soft);color:var(--muted)}
.ba-cycle{display:flex;gap:4px;flex-wrap:wrap}
.ba-cycle i{font-style:normal;font-family:var(--mono);font-size:11px;padding:4px 8px;border-radius:6px;background:var(--line-soft);color:var(--muted);transition:all .3s}
.ba-cycle i.on{background:var(--pc);color:#fff}
.ba-cycle i.done{background:color-mix(in oklab,var(--pc) 18%,var(--surface));color:var(--ink)}
.ba-log{padding:16px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;max-height:440px}
.ba-m{max-width:88%;padding:10px 13px;border-radius:16px;font-size:14.5px;line-height:1.5;animation:baIn .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes baIn{from{opacity:0;transform:translateY(8px)}}
.ba-m.me{align-self:flex-end;background:var(--ink);color:var(--canvas);border-bottom-right-radius:5px}
.ba-m.from{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line-soft);border-bottom-left-radius:5px}
.ba-m.typing{display:flex;gap:4px;padding:12px 14px}
.ba-m.typing span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:baDot 1s infinite}
.ba-m.typing span:nth-child(2){animation-delay:.15s}.ba-m.typing span:nth-child(3){animation-delay:.3s}
@keyframes baDot{50%{opacity:.25;transform:translateY(-3px)}}
.ba-m.end{align-self:center;background:none;border:1px dashed var(--line);color:var(--muted);font-size:12.5px;font-family:var(--mono);padding:6px 10px;border-radius:8px}
.ba-m.end.good{border-color:var(--pc);color:var(--pc)}
.ba-m.plan ol{margin:8px 0 10px;padding-left:0;list-style:none;display:grid;gap:6px;counter-reset:s}
.ba-m.plan li{counter-increment:s;display:flex;gap:8px;align-items:center}
.ba-m.plan li::before{content:counter(s);flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:500 11px var(--mono);background:var(--line-soft);color:var(--muted);transition:all .3s}
.ba-m.plan li.run::before{content:"";border:2px solid var(--pc);border-top-color:transparent;background:none;animation:spin .7s linear infinite}
.ba-m.plan li.ok::before{content:"✓";background:var(--pc);color:#fff}
.ba-m.plan small{display:block;color:var(--muted);font-size:12px;margin-top:6px}
.ba-ok{border:0;background:var(--pc);color:#fff;font-weight:600;font-size:14px;padding:8px 14px;border-radius:10px;cursor:pointer}
.ba-ok:disabled{opacity:.7;cursor:default}
.ba-ok.nudge{animation:baNudge 1.2s ease-in-out infinite}
@keyframes baNudge{50%{box-shadow:0 0 0 8px color-mix(in oklab,var(--pc) 25%,transparent)}}
.ba-m.done{border-color:color-mix(in oklab,var(--pc) 45%,transparent);background:color-mix(in oklab,var(--pc) 10%,var(--surface-2))}
.ba-foot{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
/* delivery tracker */
.dlv{position:relative;width:min(100%,320px);aspect-ratio:780/1826;border-radius:40px;background:#fff;overflow:hidden;box-shadow:0 0 0 10px #0b0c10,0 40px 70px -30px rgba(10,14,30,.55);margin:10px}
.dlv>img,.dlv>span,.dlv>div{position:absolute;left:0;width:100%}
.d-hdr{top:0;height:9.858%}
.d-scene{top:9.858%;height:23.22%;background-repeat:repeat-x;background-size:auto 100%;background-position:0 0;overflow:hidden}
.dlv.run .d-scene{animation:dDrive 2.2s linear infinite}
@keyframes dDrive{to{background-position:calc(var(--tw,150px) * -1) 0}}
.d-road{position:absolute;left:0;right:0;bottom:7%;height:3px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.55) 0 18px,transparent 18px 40px)}
.dlv.run .d-road{animation:dRoad .5s linear infinite}
@keyframes dRoad{to{background-position:-40px 0}}
.d-truck{position:absolute;left:17.82%;top:35.38%;width:49.6%;filter:drop-shadow(0 6px 4px rgba(60,30,10,.35))}
.dlv.run .d-truck{animation:dBump .32s ease-in-out infinite alternate}
@keyframes dBump{to{transform:translateY(-1.5%) rotate(-.25deg)}}
.d-base{top:33.13%;height:9.31%}
.d-red{top:33.13%;height:6.13%;clip-path:inset(0 0 0 75.4%)}
.dlv.run .d-red{animation:dSteps 9s cubic-bezier(.6,0,.3,1) infinite}
@keyframes dSteps{0%,18%{clip-path:inset(0 0 0 75.4%)}36%,58%{clip-path:inset(0 0 0 44.4%)}76%,96%{clip-path:inset(0 0 0 13.6%)}100%{clip-path:inset(0 0 0 75.4%)}}
.d-ping{width:11%!important;aspect-ratio:1;border-radius:50%;border:3px solid #A51E22;top:34.9%;opacity:0;translate:-50% 0}
.d-ping.p1{left:50%!important}.d-ping.p2{left:19.2%!important}
.dlv.run .d-ping.p1{animation:dPing 9s infinite;animation-delay:0s}
.dlv.run .d-ping.p2{animation:dPing2 9s infinite}
@keyframes dPing{0%,35%{opacity:0;transform:scale(.8)}37%{opacity:1;transform:scale(1)}48%,100%{opacity:0;transform:scale(1.8)}}
@keyframes dPing2{0%,74%{opacity:0;transform:scale(.8)}76%{opacity:1;transform:scale(1)}87%,100%{opacity:0;transform:scale(1.8)}}
.d-det{top:42.44%;height:57.56%}
@media (prefers-reduced-motion:reduce){.dlv.run .d-scene,.dlv.run .d-road,.dlv.run .d-truck,.dlv.run .d-red,.dlv.run .d-ping{animation:none}.d-red{clip-path:inset(0 0 0 13.6%)}}
/* booking */
.bk{position:fixed;inset:0;z-index:120;background:rgba(8,10,16,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;animation:fadeIn .2s both}
.bk-card{width:min(560px,100%);max-height:calc(100vh - 32px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:clamp(18px,3vw,28px);display:grid;gap:16px;box-shadow:0 40px 80px -30px rgba(0,0,0,.5);animation:lbIn .3s cubic-bezier(.2,.8,.2,1) both}
.bk-head{display:flex;justify-content:space-between;gap:12px;align-items:start}
.bk-head h2{margin:4px 0 6px;font-family:var(--display);font-size:clamp(24px,3vw,30px);letter-spacing:-.02em}
.bk-form{display:grid;gap:12px}
.bk-form input,.bk-form select,.bk-form textarea{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.bk-form input:focus,.bk-form select:focus,.bk-form textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 20%,transparent)}
.row3{display:grid;grid-template-columns:1.3fr 1fr .9fr;gap:12px}
@media (max-width:520px){.row3{grid-template-columns:1fr 1fr}.row3 label:last-child{grid-column:1/-1}}
.bk-acts{display:flex;gap:10px;flex-wrap:wrap}
.bk-acts .btn svg{width:16px;height:16px}
.bk-direct{justify-content:center}
.bk-or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.bk-or::before,.bk-or::after{content:"";flex:1;height:1px;background:var(--line)}
.bk-note.warn{color:#D93025}
.bk-open body{overflow:hidden}
/* studies + ai */
.grid.studies{grid-template-columns:1fr}
.card.study .cover{aspect-ratio:21/8}
.study-tag{position:absolute;left:14px;top:14px;z-index:2;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:var(--surface-2);color:var(--ink);padding:5px 9px;border-radius:7px;box-shadow:var(--shadow)}
@media (max-width:760px){.card.study .cover{aspect-ratio:16/10}}
.aiw{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:900px){.aiw{grid-template-columns:1fr}}
.aiw-col{border:1px solid var(--line);border-radius:22px;padding:22px;background:var(--surface);display:grid;gap:14px;align-content:start}
.aiw-col.c-use{background:linear-gradient(170deg,color-mix(in oklab,var(--accent) 10%,var(--surface)),var(--surface) 60%)}
.aiw-col.c-build{background:linear-gradient(170deg,color-mix(in oklab,#12A38A 12%,var(--surface)),var(--surface) 60%)}
.aiw-h{display:flex;gap:12px;align-items:center}
.aiw-h h3{margin:0;font-family:var(--display);font-size:20px;letter-spacing:-.015em;line-height:1.2}
.aiw-ic{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:18px;background:var(--surface-2);border:1px solid var(--line-soft)}
.aiw ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.aiw li{position:relative;padding-left:18px;font-size:15.5px;line-height:1.5}
.aiw li::before{content:"";position:absolute;left:0;top:.6em;width:7px;height:7px;border-radius:2px;background:var(--accent)}
.aiw .c-keep li::before{background:var(--ink)}
.aiw .c-build li::before{background:#12A38A}

@media (prefers-reduced-motion:reduce){.fx .lift,.fx .base,.cs .cover .cv-art{transition:none;animation:none}}

.hello{font-family:var(--display);font-weight:600;font-size:clamp(20px,2.4vw,28px);letter-spacing:-.015em;margin:26px 0 0;animation:csIn .8s cubic-bezier(.2,.8,.2,1) .1s both}
.sel.after-hello{margin-top:18px}
.headline.long{font-size:clamp(34px,4.9vw,70px);max-width:19ch;line-height:1.02}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .track{animation:none!important;overflow-x:auto}
  .marquee{overflow-x:auto}
  .shots-lane{overflow-x:auto}
}

/* ===== v4: manager feedback ===== */
/* Zizo launcher on the right, owner button on the left */
.zz-launch{left:auto;right:16px}
.zz-bubble,.zz-bubble{left:auto;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));border-radius:16px 16px 4px 16px}
.admin-fab,.zz-open .admin-fab{right:auto;left:16px}
.lede{margin-top:28px}

/* stats: short and calm */
.stat span{max-width:20ch;font-size:15px}

/* resume: numbers stand out, one sentence in focus */
.job ul.pts li{color:color-mix(in oklab,var(--ink) 72%,var(--muted));transition:opacity .3s,transform .35s cubic-bezier(.2,.8,.2,1),color .3s}
.job ul.pts li .n{font-weight:500;color:var(--ink);background:linear-gradient(var(--accent),var(--accent)) 0 100%/0 2px no-repeat;transition:background-size .45s cubic-bezier(.2,.8,.2,1),color .3s}
.job ul.pts li::before{transition:width .35s cubic-bezier(.2,.8,.2,1)}
@media (hover:hover){
  .job ul.pts:hover li{opacity:.38}
  .job ul.pts li:hover{opacity:1;color:var(--ink);transform:translateX(6px)}
  .job ul.pts li:hover::before{width:14px}
  .job ul.pts li:hover .n{background-size:100% 2px;color:var(--accent)}
}

/* about: portrait hover */
.portrait{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .5s cubic-bezier(.2,.8,.2,1),box-shadow .5s;will-change:transform}
.portrait img{transition:transform .8s cubic-bezier(.2,.8,.2,1),filter .6s;filter:saturate(.92)}
.portrait .pt-hi{position:absolute;right:12px;top:12px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:14px;padding:8px 12px;border-radius:12px 12px 4px 12px;opacity:0;transform:translateY(8px) scale(.9);transition:opacity .35s,transform .45s cubic-bezier(.2,1.4,.4,1);pointer-events:none}
.portrait .pt-shine{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--sx,50%) 0%,rgba(255,255,255,.28),transparent 55%);opacity:0;transition:opacity .4s}
.portrait:hover{box-shadow:0 30px 60px -28px rgba(16,18,24,.45)}
.portrait:hover img{transform:scale(1.06);filter:saturate(1.08)}
.portrait:hover .pt-hi{opacity:1;transform:none}
.portrait:hover .pt-shine{opacity:1}
.portrait:hover .cap{background:var(--ink);color:var(--canvas)}
.portrait .cap{transition:background .3s,color .3s}
.about .prose p{font-size:18px;line-height:1.6}
.about{align-items:center}

/* charts: use the full width */
.ch{max-width:none;width:100%}
.ch-rings{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:clamp(16px,3vw,32px)}
.ch-rings figure{width:auto;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;justify-items:start;text-align:left;gap:20px}
.ch-rings svg{width:132px;height:132px}
.ch-rings b{top:66px;left:66px;font-size:30px}
.ch-rings figcaption{font-size:18px;color:var(--ink);font-weight:500;line-height:1.35;max-width:22ch}
.ch-row{grid-template-columns:minmax(110px,160px) minmax(0,1fr) auto}
.ch-trk{grid-column:auto;order:0;height:20px}
@media (max-width:640px){
  .ch-rings figure{gap:14px}.ch-rings svg{width:96px;height:96px}.ch-rings b{top:48px;left:48px;font-size:22px}.ch-rings figcaption{font-size:15px}
  .ch-row{grid-template-columns:1fr auto}.ch-trk{grid-column:1/-1;order:3}
}

/* ===== footer reveal (contact) ===== */
.pg{position:relative;z-index:2;background:var(--canvas)}
.ft-reveal .pg{border-radius:0 0 36px 36px;box-shadow:0 40px 80px -30px rgba(0,0,0,.45);padding-bottom:40px}
.ft{--p:0;--fbg:#26292F;--fbg2:#2E3239;--fink:#F3F4F7;--fmut:#A9AFBB;--fline:#3A3F48;position:relative;z-index:1;background:var(--fbg);color:var(--fink);overflow:hidden}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ft{--fbg:#1D2027;--fbg2:#262A32;--fline:#343944}}
:root[data-theme="dark"] .ft{--fbg:#1D2027;--fbg2:#262A32;--fline:#343944}
.ft.sticky{position:sticky;bottom:0;min-height:100vh;display:grid}
.ft-in{position:relative;display:grid;align-content:center;gap:clamp(32px,6vh,72px);padding-block:clamp(72px,12vh,120px) 28px;transform:translateY(calc((1 - var(--p)) * -90px)) scale(calc(.94 + var(--p) * .06));opacity:calc(.35 + var(--p) * .65);transform-origin:50% 100%}
.ft:not(.sticky) .ft-in{transform:none;opacity:1}
.ft::before{content:"";position:absolute;width:780px;height:780px;border-radius:50%;right:-240px;top:-300px;background:radial-gradient(circle,color-mix(in oklab,var(--accent) 38%,transparent),transparent 62%);opacity:calc(.25 + var(--p) * .35);transform:translateY(calc((1 - var(--p)) * 120px));pointer-events:none}
.ft-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,400px);gap:clamp(32px,6vw,96px);align-items:center;width:100%}
.ft-k{color:var(--fmut);text-transform:uppercase;letter-spacing:.14em}
.ft-h{font-family:var(--display);font-weight:800;font-size:clamp(44px,6.6vw,96px);line-height:.98;letter-spacing:-.04em;margin:14px 0 0;color:var(--fink)}
.ft-h .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.06em}
.ft-h .w>span{display:inline-block;transform:translateY(105%);transition:transform 1s cubic-bezier(.2,.8,.2,1) calc(var(--k) * 70ms)}
.ft.in .ft-h .w>span{transform:none}
.ft-sub{color:var(--fmut);font-size:19px;margin:20px 0 0;max-width:36ch}
.ft-mail{display:inline-flex;align-items:center;gap:14px;margin-top:36px;color:var(--fink);text-decoration:none;font-family:var(--display);font-weight:600;font-size:clamp(22px,2.6vw,34px);letter-spacing:-.02em;padding-bottom:6px;background:linear-gradient(var(--fink),var(--fink)) 0 100%/100% 2px no-repeat;transition:background-size .5s cubic-bezier(.2,.8,.2,1),gap .4s}
.ft-mail svg{width:.8em;height:.8em;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.ft-mail:hover{background-size:0 2px;background-position:100% 100%;gap:20px}
.ft-mail:hover svg{transform:translateX(4px) rotate(-45deg)}
.ft-meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:28px}
.ft-ph{color:var(--fmut);text-decoration:none;font-family:var(--mono);font-size:14px;margin-right:8px}
.ft-ph:hover{color:var(--fink)}

/* calendar */
.cal{position:relative;background:var(--fbg2);border:1px solid var(--fline);border-radius:24px;padding:22px;box-shadow:0 40px 80px -40px rgba(0,0,0,.6);transform:translateY(calc((1 - var(--p)) * 70px)) rotate(calc((1 - var(--p)) * 3deg));transition:box-shadow .4s}

.cal-av{width:40px;height:40px;border-radius:50%;overflow:hidden;background:var(--accent);display:grid;place-items:center;font-weight:700;box-shadow:0 0 0 3px var(--fbg2),0 0 0 5px color-mix(in oklab,var(--accent) 60%,transparent)}
.cal-av img{width:100%;height:100%;object-fit:cover}
.cal-wd,.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-wd{margin-top:16px;font-family:var(--mono);font-size:11px;color:var(--fmut)}
.cal-g{margin-top:6px}
.cal-g i{aspect-ratio:1}
.cd{aspect-ratio:1;border:0;border-radius:10px;background:transparent;color:var(--fink);font-size:14px;font-weight:500;cursor:pointer;opacity:0;transform:scale(.6);transition:opacity .4s calc(var(--i) * 18ms),transform .5s cubic-bezier(.2,1.4,.4,1) calc(var(--i) * 18ms),background .2s,color .2s}
.ft.in .cd{opacity:1;transform:none}
.cd.off{color:color-mix(in oklab,var(--fmut) 55%,transparent);cursor:default}
.cd:not(.off):hover{background:var(--fline)}
.cd.on{background:var(--accent);color:#fff}
.ft.in .cd.on{animation:calPick .7s cubic-bezier(.2,1.4,.4,1) 1.1s both}

.cal-slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:16px}
.sl{border:1px solid var(--fline);background:transparent;color:var(--fink);border-radius:10px;padding:9px 0;font-family:var(--mono);font-size:13px;cursor:pointer;opacity:0;transform:translateY(10px);transition:opacity .4s calc(.9s + var(--k) * 80ms),transform .5s cubic-bezier(.2,.8,.2,1) calc(.9s + var(--k) * 80ms),background .2s,border-color .2s}
.ft.in .sl{opacity:1;transform:none}
.sl:hover{border-color:var(--fmut)}
.sl.on{background:var(--fink);color:var(--fbg);border-color:var(--fink)}
.cal-go{width:100%;justify-content:center;margin-top:14px}
.ft.in .cal-go{animation:calGo 2.4s ease-in-out 1.6s 2}

.cal-tz{color:var(--fmut);text-align:center;margin:10px 0 0}

/* 3D delivery scene */
.dlv{container-type:inline-size}

/* ===== animated covers ===== */
.anv{position:absolute;inset:0;container-type:size;overflow:hidden;background:radial-gradient(closest-side at 50% 58%,color-mix(in oklab,var(--pc) 22%,var(--canvas)) 0%,color-mix(in oklab,var(--pc) 8%,var(--canvas)) 60%,var(--canvas) 100%)}
.anv .an-txt{position:absolute;right:6cqw;top:50%;width:30cqw;transform:translate(4cqw,-50%);opacity:0;transition:opacity .6s .35s,transform .9s .3s cubic-bezier(.2,.8,.2,1);color:var(--ink)}
.anv .k{display:block;font:500 max(10px,1.05cqw)/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--redline)}

.anv.on .an-hint{opacity:0}
@media (hover:none){.anv .an-hint{display:none}}
/* laptop */
.lp{position:absolute;inset:0;perspective:2200px;perspective-origin:50% -90%;transition:perspective-origin 1s cubic-bezier(.2,.8,.2,1)}
.lp-dev{position:absolute;left:50%;top:24%;width:38cqw;transform:translate(-50%,-50%);transform-style:preserve-3d;transition:left 1s cubic-bezier(.2,.8,.2,1),top 1s cubic-bezier(.2,.8,.2,1),transform 1s cubic-bezier(.2,.8,.2,1)}
.lp-lid{position:relative;z-index:2;width:100%;aspect-ratio:16/10.4;transform-origin:50% 100%;transform-style:preserve-3d;transform:rotateX(-88deg);transition:transform 1.1s cubic-bezier(.3,.9,.25,1)}
.lp-front,.lp-back{position:absolute;inset:0;border-radius:1.3cqw 1.3cqw .4cqw .4cqw;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.lp-front{background:#0C0D10;padding:2.2% 2.2% 3.4%;box-shadow:inset 0 0 0 1px #2a2c33}
.lp-scr{width:100%;height:100%;border-radius:.5cqw;overflow:hidden;background:#EDEDF0;position:relative}
.lp-scr img{width:100%;display:block}
.lp-scr::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.2),transparent 40%);pointer-events:none}
.lp-back{transform:rotateX(180deg);background:linear-gradient(180deg,#DADDE3,#BCC2CB);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.lp-back::after{content:"";position:absolute;left:50%;top:50%;width:9%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;background:rgba(255,255,255,.6)}
.lp-deck{position:absolute;left:-3%;width:106%;bottom:1.3cqw;aspect-ratio:16/10.4;transform-origin:50% 100%;transform:rotateX(-90deg);border-radius:.6cqw .6cqw 1.6cqw 1.6cqw;background:linear-gradient(180deg,#C9CDD4,#E4E7EC);box-shadow:inset 0 0 0 1px rgba(0,0,0,.07),0 2cqw 3cqw rgba(16,24,48,.18)}
.lp-deck::before{content:"";position:absolute;left:9%;right:9%;top:50%;height:42%;border-radius:.8cqw;background:repeating-linear-gradient(90deg,#2A2D33 0 6.4%,#3A3E46 6.4% 7.1%),#2A2D33;opacity:.9}
.lp-deck::after{content:"";position:absolute;left:34%;right:34%;top:8%;height:34%;border-radius:1cqw;background:#D4D8DE;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.lp-base{position:relative;width:116%;margin-left:-8%;height:1.3cqw;background:linear-gradient(180deg,#E3E6EB,#AEB4BE);border-radius:2px 2px 1.5cqw 1.5cqw}
.lp-base::before{content:"";position:absolute;left:50%;top:0;width:16%;height:45%;translate:-50% 0;border-radius:0 0 .8cqw .8cqw;background:#A3A9B3}
.anv.on .lp{perspective-origin:32% -90%}
.anv.on .lp-lid{transform:rotateX(-6deg)}
.anv.on .lp-dev{left:33%;top:31%;transform:translate(-50%,-50%) scale(.9)}
/* phones */
.pf3{position:absolute;inset:0}
.pf{position:absolute;left:50%;top:50%;width:15cqw;aspect-ratio:560/1191;padding:.55cqw;border-radius:2.5cqw;background:#0B0C0E;box-shadow:0 0 0 .35cqw #A9C0D8,0 0 0 .5cqw #7F98B4,0 3cqw 4cqw -2cqw rgba(16,24,48,.55);--x:0cqw;--r:0deg;--y:0cqw;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(var(--r));transition:transform 1s cubic-bezier(.2,.8,.2,1) calc(var(--k) * 60ms)}
.pf-s{width:100%;height:100%;border-radius:2cqw;overflow:hidden;background:#fff}
.pf-s img{width:100%;display:block}
.pf:nth-child(1){--x:-2.4cqw;--r:-5deg;--y:1cqw}
.pf:nth-child(3){--x:2.4cqw;--r:5deg;--y:1cqw}

/* ===== QX animated diagrams ===== */
.qx{--qa:var(--pc);--qs:color-mix(in oklab,var(--pc) 10%,var(--surface));--qe:cubic-bezier(.2,.8,.2,1);position:relative;border:1px solid var(--line-soft);background:var(--surface);border-radius:24px;padding:clamp(18px,3vw,32px);overflow:hidden}
.qx .mono{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.qx-note{margin:18px 0 0;font-size:13px;color:var(--muted)}
.qx-replay{font:500 12px var(--mono);letter-spacing:.04em;color:var(--muted);background:var(--canvas);border:1px solid var(--line-soft);border-radius:99px;padding:6px 12px;cursor:pointer;transition:color .2s,border-color .2s}
.qx-replay:hover{color:var(--ink);border-color:var(--line)}
/* tools → one */
.qx-tools{background:radial-gradient(60% 70% at 50% 45%,color-mix(in oklab,var(--pc) 14%,transparent),transparent 70%),var(--surface)}
.qt-field{position:relative;height:clamp(300px,42vw,400px)}
.qt-rings{position:absolute;inset:0;margin:auto;width:min(100%,400px);height:100%;fill:none;stroke:var(--line);stroke-dasharray:3 6;opacity:.7}
.qt-chip{position:absolute;left:var(--l);top:var(--t);z-index:2;transform:translate(-50%,-50%) rotate(var(--rot));display:inline-flex;align-items:center;gap:8px;white-space:nowrap;padding:8px 13px 8px 8px;border-radius:12px;background:var(--canvas);border:1px solid var(--line-soft);box-shadow:0 8px 24px -14px rgba(16,18,24,.35);font-size:13.5px;font-weight:500;transition:left 1s var(--qe),top 1s var(--qe),transform 1s var(--qe),opacity .6s;transition-delay:calc(var(--k)*.12s + .3s);animation:qtBob 4s ease-in-out infinite;animation-delay:calc(var(--k)*-.4s)}
.qt-chip i{display:grid;place-items:center;width:22px;height:22px;border-radius:7px;font-style:normal;font-size:11px;font-weight:700;background:color-mix(in oklab,var(--pc) 16%,var(--surface));color:var(--pc)}
@keyframes qtBob{50%{margin-top:-5px}}
.qx-tools.on .qt-chip{left:50%;top:50%;transform:translate(-50%,-50%) scale(.35);opacity:0;animation:none}
.qt-core{position:absolute;left:50%;top:50%;z-index:3;transform:translate(-50%,-50%) scale(.6);opacity:0;display:grid;justify-items:center;gap:4px;padding:22px 30px;border-radius:22px;background:var(--canvas);border:1px solid color-mix(in oklab,var(--pc) 40%,var(--line-soft));box-shadow:0 30px 60px -30px color-mix(in oklab,var(--pc) 60%,transparent),0 0 0 8px color-mix(in oklab,var(--pc) 8%,transparent);transition:transform .8s var(--qe) 1.6s,opacity .6s 1.6s}
.qx-tools.on .qt-core{transform:translate(-50%,-50%) scale(1);opacity:1}
.qt-logo{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--pc);color:#fff;font:700 20px var(--display)}
.qt-core b{font:700 22px var(--display);letter-spacing:-.02em}
.qt-core small{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.qt-meter{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:6px;font-size:14px;color:var(--muted)}
.qt-meter b{font:700 28px var(--display);color:var(--ink);font-variant-numeric:tabular-nums;margin-right:4px}
.qt-to b{color:var(--pc)}
.qt-from b{transition:color .4s 1.4s;text-decoration:line-through;text-decoration-color:transparent;text-decoration-thickness:3px}
.qx-tools.on .qt-from b{color:var(--muted);text-decoration-color:color-mix(in oklab,var(--pc) 80%,transparent)}
.qt-to{opacity:.35;transition:opacity .5s 1.8s}.qx-tools.on .qt-to{opacity:1}
.qt-meter>i{width:48px;height:2px;background:linear-gradient(90deg,var(--line),var(--pc));border-radius:2px}
/* day timeline */
.qd-head{display:grid;grid-template-columns:auto auto 1fr auto;align-items:center;gap:14px;margin-bottom:26px}
.qd-n{font:700 34px var(--display);color:var(--pc);font-variant-numeric:tabular-nums;min-width:1ch}
.qd-bar{height:6px;border-radius:6px;background:var(--line-soft);overflow:hidden}
.qd-bar i{display:block;height:100%;width:0;background:var(--pc);border-radius:inherit;transition:width .6s var(--qe)}
.qd-rail{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;position:relative}
.qd-rail:before{content:"";position:absolute;left:0;right:0;top:34px;height:2px;background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 12px)}
.qd-rail li{position:relative;display:grid;gap:8px;align-content:start;opacity:.35;transform:translateY(8px);transition:opacity .5s,transform .5s var(--qe)}
.qd-rail li.lit{opacity:1;transform:none}
.qd-rail time{font:600 13px var(--mono);color:var(--muted)}
.qd-dot{width:14px;height:14px;border-radius:50%;background:var(--canvas);border:2px solid var(--line);position:relative;z-index:1;transition:background .3s,border-color .3s,box-shadow .3s}
.qd-rail li.lit .qd-dot{background:var(--pc);border-color:var(--pc);box-shadow:0 0 0 6px color-mix(in oklab,var(--pc) 18%,transparent)}
.qd-rail p{margin:0;font-size:14px;line-height:1.4}
.qd-app{justify-self:start;font:600 11px var(--mono);letter-spacing:.04em;padding:4px 9px;border-radius:99px;background:color-mix(in oklab,var(--pc) 12%,var(--canvas));color:var(--pc);border:1px solid color-mix(in oklab,var(--pc) 25%,transparent)}
.qd-app.off{background:transparent;color:var(--muted);border-style:dashed;border-color:var(--line)}
@media (max-width:860px){.qd-rail{grid-template-columns:1fr;gap:0}.qd-rail:before{left:6px;right:auto;top:8px;bottom:8px;width:2px;height:auto;background:repeating-linear-gradient(180deg,var(--line) 0 6px,transparent 6px 12px)}
  .qd-rail li{grid-template-columns:14px 52px 1fr;column-gap:14px;row-gap:4px;padding:10px 0;transform:translateX(8px)}.qd-rail li.lit{transform:none}.qd-rail .qd-dot{grid-row:1/3;grid-column:1;margin-top:3px}.qd-rail time{grid-column:2}.qd-rail p{grid-column:3;grid-row:1}.qd-rail .qd-app{grid-column:3;grid-row:2}
  .qd-head{grid-template-columns:auto auto 1fr}.qd-head .qx-replay{grid-column:1/-1;justify-self:start}}
/* field notes */
.qx-notes{background:radial-gradient(var(--line) 1px,transparent 1.2px) 0 0/18px 18px,var(--surface)}
.qn-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px}
.qn{position:relative;margin:0;padding:22px 18px 18px;border-radius:6px 6px 18px 6px;background:var(--canvas);border:1px solid var(--line-soft);box-shadow:0 18px 30px -24px rgba(16,18,24,.5);transform:rotate(var(--rot)) translateY(-30px);opacity:0;transition:transform .7s var(--qe),opacity .5s;transition-delay:calc(var(--k)*.14s)}
.qx-notes.on .qn{transform:rotate(var(--rot));opacity:1}
.qn:hover{transform:rotate(0) translateY(-4px)!important}
.qn-pin{position:absolute;top:-7px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--pc);box-shadow:0 3px 6px -2px rgba(0,0,0,.4),inset -2px -2px 0 rgba(0,0,0,.15)}
.qn figcaption{font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--pc);margin-bottom:8px}
.qn p{margin:0;font-size:14.5px;line-height:1.5}
/* flip cards */
.qf-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.qf{all:unset;cursor:pointer;display:block;perspective:1000px;min-height:230px;border-radius:20px}
.qf:focus-visible{outline:2px solid var(--pc);outline-offset:3px}
.qf-in{position:relative;display:block;height:100%;min-height:230px;transform-style:preserve-3d;transition:transform .8s var(--qe)}
.qf.flip .qf-in{transform:rotateY(180deg)}

/* Zizo: Claude-style working UI */
.zz-row.zz-bot{gap:12px}
.zz-av{--s:28px;flex:none;position:relative;width:var(--s);height:var(--s);margin-top:1px;border-radius:9px;background:var(--ink);color:var(--canvas);display:inline-flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:11.5px;letter-spacing:-.02em;line-height:1}
.zz-av b{display:inline-block;font-weight:inherit;transition:transform .3s}
.zz-av::before{content:"";position:absolute;inset:-3px;border-radius:12px;padding:2px;background:conic-gradient(from var(--zza,0deg),transparent 0 55%,var(--accent) 80%,transparent 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .3s}
.zz-av.work::before{opacity:1;animation:zzRing 1.1s linear infinite}
.zz-av.work b:first-child{animation:zzHop .9s ease-in-out infinite}
.zz-av.work b:last-child{animation:zzHop .9s ease-in-out .45s infinite}
.zz-av:not(.work){animation:zzSettle .45s cubic-bezier(.3,1.6,.5,1)}
@property --zza{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes zzRing{to{--zza:360deg}}
@keyframes zzHop{0%,100%{transform:translateY(0)}35%{transform:translateY(-2.5px)}}
@keyframes zzSettle{0%{transform:scale(.86)}100%{transform:scale(1)}}
.zz-msg.from-z.zz-ans{background:none;border:0;padding:3px 0 0;max-width:calc(100% - 40px);flex:1;border-radius:0;animation:none}
.zz-wk:empty{display:none}
.zz-work{display:block;margin:0 0 8px;font-size:13px;color:var(--muted)}
.zz-steps{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.zz-steps li{display:flex;align-items:center;gap:8px;animation:zzStepIn .35s ease both}
.zz-steps li i{width:16px;height:16px;flex:none;display:grid;place-items:center;border-radius:50%;color:var(--muted)}
.zz-steps li.ok i{background:var(--surface-2);border:1px solid var(--line-soft)}
.zz-steps li.cur i::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);animation:zzPulse 1s ease-in-out infinite}
.zz-steps li.cur span{background:linear-gradient(90deg,var(--muted) 0%,var(--muted) 35%,var(--ink) 50%,var(--muted) 65%,var(--muted) 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:zzShimmer 1.8s linear infinite}
@keyframes zzShimmer{from{background-position:100% 0}to{background-position:-150% 0}}
@keyframes zzPulse{0%,100%{transform:scale(.7);opacity:.6}50%{transform:scale(1.15);opacity:1}}
@keyframes zzStepIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.zz-wsum{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--muted);padding:2px 0;border-radius:6px}
.zz-wsum:hover{color:var(--ink)}
.zz-wsum:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.zz-wsum svg{transition:transform .2s}
.zz-work.zz-wopen .zz-wsum svg{transform:rotate(90deg)}
.zz-wbody{display:none;margin:8px 0 2px 6px;padding:2px 0 2px 14px;border-left:1.5px solid var(--line)}
.zz-work.zz-wopen .zz-wbody{display:grid;gap:10px;animation:zzStepIn .25s ease both}
.zz-thought{font-size:13px;line-height:1.55;color:var(--muted)}
.zz-thought p{margin:0 0 6px}
.zz-thought ul{margin:2px 0 6px;padding-left:16px}
.zz-fade{animation:zzFade .55s ease both}
@keyframes zzFade{from{opacity:0;filter:blur(2px)}to{opacity:1;filter:none}}
@media (prefers-reduced-motion:reduce){.zz-av::before,.zz-av b,.zz-steps li,.zz-steps li.cur span,.zz-steps li.cur i::before,.zz-fade{animation:none!important}.zz-steps li.cur span{color:var(--ink);background:none}}

/* ===== qx4: Tryout case study ===== */
/* calc */
.tc{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;align-items:stretch}
@media (max-width:860px){.tc{grid-template-columns:1fr}}
.tc-card,.tc-calc{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:16px;padding:18px}
.tc-top{display:grid;gap:2px;margin-bottom:14px}
.tc-top b{font-family:var(--display);font-size:20px;letter-spacing:-.01em}
.tc-top small{color:var(--muted);font-size:13px}
.tc-demo{justify-self:start;font:500 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--pc);background:color-mix(in oklab,var(--pc) 10%,transparent);padding:3px 7px;border-radius:5px;margin-bottom:6px}
.tc-kpis{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px}
@media (max-width:520px){.tc-kpis{grid-template-columns:1fr}}
.tc-k{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:10px;align-items:center;border:1.5px solid var(--line-soft);border-radius:12px;padding:12px;transition:border-color .2s,background .2s,transform .2s}
.tc-k:hover{border-color:color-mix(in oklab,var(--pc) 50%,var(--line))}
.tc-k[aria-pressed="true"]{border-color:var(--pc);background:color-mix(in oklab,var(--pc) 6%,var(--surface-2))}
.tc-k:focus-visible{outline:2px solid var(--pc);outline-offset:2px}
.tc-k>b{font-family:var(--display);font-size:26px;letter-spacing:-.02em;line-height:1}
.tc-k:not(:has(.tc-ring)){flex-direction:column;align-items:flex-start;gap:4px}
.tc-kt{display:grid;gap:2px;min-width:0}
.tc-kt em{font-style:normal;font-weight:500;font-size:13.5px}
.tc-kt small{color:var(--muted);font-size:12px;line-height:1.35}
.tc-ring{--p:0;flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--pc) calc(var(--p)*1%),var(--line-soft) 0);position:relative}
.tc-ring::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--surface-2)}
.tc-ring i{position:relative;font-style:normal;font-weight:600;font-size:14px;font-family:var(--display)}
.tc-rng{margin-top:16px;padding-top:14px;border-top:1px solid var(--line-soft);display:grid;gap:12px}
.tc-rh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13.5px;font-weight:500}
.tc-ns{display:flex;gap:4px;background:var(--canvas);border-radius:10px;padding:3px}
.tc-ns button{border:0;background:none;border-radius:7px;padding:5px 11px;font:500 13px var(--mono);cursor:pointer;color:var(--muted)}
.tc-ns button[aria-checked="true"]{background:var(--surface-2);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tc-axis{position:relative;height:30px;margin:4px 6px 14px;border-radius:6px;background:repeating-linear-gradient(90deg,var(--line-soft) 0 1px,transparent 1px 10%)}
.tc-axis::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:var(--line)}
.tc-band{position:absolute;top:6px;bottom:6px;border-radius:9px;background:color-mix(in oklab,var(--pc) 22%,transparent);border:1.5px solid var(--pc);z-index:1;transition:left .6s cubic-bezier(.2,.8,.2,1),width .6s cubic-bezier(.2,.8,.2,1)}
.tc-pt{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--pc);border:2px solid var(--surface-2);z-index:2}
.tc-axis i{position:absolute;top:100%;transform:translateX(-50%);font:400 10.5px var(--mono);color:var(--muted);font-style:normal;margin-top:3px}
.tc-rtxt{margin:0;font-size:13.5px;color:var(--muted)}
.tc-rtxt b{color:var(--ink);font-weight:600}
.tc-calc{font-family:var(--mono);font-size:12.5px;line-height:1.65;display:grid;align-content:start;gap:10px}
.tc-ch{color:var(--pc);font-family:var(--body);font-size:13.5px;font-weight:500;text-decoration:underline;text-underline-offset:3px}
.tc-tri{display:inline-block;text-decoration:none}
.tc-lines{display:grid;gap:8px}
.tc-lines b{color:var(--pc)}
.tc-lines .t-sub{color:var(--muted);font-family:var(--body);font-size:12.5px}
.tc-lines.in>div{animation:tcLine .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--j)*70ms)}
@keyframes tcLine{from{opacity:0;transform:translateY(6px)}}
/* mic */
.tm{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:14px;align-items:stretch}
@media (max-width:820px){.tm{grid-template-columns:1fr}.tm-ar{transform:rotate(90deg);justify-self:center}}
.tm-ar{display:grid;place-items:center;color:var(--muted)}
.tm-p{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:16px;padding:18px;display:grid;gap:12px;align-content:start}
.tm-tag{justify-self:start;font:500 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:5px}
.tm-before .tm-tag{color:color-mix(in oklab,#D93025 80%,var(--ink));background:color-mix(in oklab,#D93025 10%,transparent)}
.tm-after .tm-tag{color:color-mix(in oklab,#1DB36B 70%,var(--ink));background:color-mix(in oklab,#1DB36B 12%,transparent)}
.tm-perm{display:flex;gap:10px;align-items:center;border:1px solid var(--line-soft);border-radius:12px;padding:10px 12px}
.tm-perm>svg{color:var(--pc);flex:none}
.tm-perm span{display:grid;flex:1;min-width:0}
.tm-perm b{font-size:14px}
.tm-perm small{color:var(--muted);font-size:12px}
.tm-perm em{font-style:normal;font-size:12px;font-weight:500;color:color-mix(in oklab,#1DB36B 70%,var(--ink));white-space:nowrap}
.tm-wave{position:relative;height:74px;border-radius:12px;background:var(--canvas);display:grid;place-items:center;overflow:hidden}
.tm-wave svg{position:absolute;inset:0;width:100%;height:100%}
.tm-flat{stroke:var(--muted);stroke-width:1.5;fill:none;stroke-dasharray:300;stroke-dashoffset:300}
.qx-mic.on .tm-flat{animation:tmDraw 2.2s ease-out .3s forwards}
@keyframes tmDraw{to{stroke-dashoffset:0}}
.tm-wave span{position:relative;font:600 13px var(--mono);color:#D93025;background:var(--surface-2);padding:3px 8px;border-radius:6px;box-shadow:var(--shadow)}
.tm-p p{margin:0;font-size:14px;color:var(--muted)}
.tm-h{font-family:var(--display);font-size:18px}
.tm-meter{display:flex;gap:4px;align-items:center;height:56px;padding:0 4px;border-radius:12px;background:var(--canvas)}
.tm-meter i{--h:.08;flex:1;height:calc(var(--h)*100%);min-height:3px;border-radius:3px;background:var(--line);transition:height .1s linear,background .3s}
.qx-mic.listening .tm-meter i{background:var(--pc)}
.qx-mic.heard .tm-meter i{background:#1DB36B}
.qx-mic .tm-st{color:var(--ink);min-height:2.6em}
.tm-ok{color:color-mix(in oklab,#1DB36B 70%,var(--ink));font-weight:700}
.tm-acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tm-cont{border:0;border-radius:10px;padding:10px 16px;background:var(--pc);color:#fff;font-weight:500;cursor:pointer;transition:opacity .2s,transform .2s}
.tm-cont:disabled{opacity:.35;cursor:not-allowed}
.qx-mic.heard .tm-cont{animation:tmPop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes tmPop{50%{transform:scale(1.06)}}
.tm-skip{border:0;background:none;color:var(--muted);font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.tm-sim{justify-self:start;display:inline-flex;gap:8px;align-items:center;border:1.5px dashed var(--pc);color:var(--pc);background:color-mix(in oklab,var(--pc) 6%,transparent);border-radius:999px;padding:8px 14px;font-weight:500;font-size:13.5px;cursor:pointer}
.tm-sim:hover{background:color-mix(in oklab,var(--pc) 12%,transparent)}
/* decide */
.td{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr);gap:16px;align-items:start}
@media (max-width:820px){.td{grid-template-columns:1fr}}
.td-list{display:grid;gap:6px}
.td-b{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;border:1px solid var(--line-soft);background:var(--surface-2);font-weight:500;font-size:15px;transition:border-color .2s,background .2s,transform .25s cubic-bezier(.2,.8,.2,1)}
.td-b span{font:500 12px var(--mono);color:var(--muted)}
.td-b:hover{transform:translateX(3px)}
.td-b[aria-pressed="true"]{border-color:var(--pc);background:color-mix(in oklab,var(--pc) 7%,var(--surface-2))}
.td-b[aria-pressed="true"] span{color:var(--pc)}
.td-b:focus-visible{outline:2px solid var(--pc);outline-offset:2px}
.td-stage{position:sticky;top:90px}
.td-c{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:16px;padding:22px;display:grid;gap:14px}
.td-c.in{animation:tdIn .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes tdIn{from{opacity:0;transform:translateY(10px)}}
.td-n{font:500 12px var(--mono);color:var(--pc)}
.td-c>b{font-family:var(--display);font-size:clamp(22px,2.4vw,28px);letter-spacing:-.02em;line-height:1.15;margin-top:-6px}
.td-r{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;padding-top:12px;border-top:1px solid var(--line-soft)}
@media (max-width:480px){.td-r{grid-template-columns:1fr;gap:2px}}
.td-r em{font-style:normal;font:500 11px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.td-r p{margin:0;font-size:15.5px}
.td-r.no p{color:var(--muted)}
.td-r.no p::before{content:"✕";display:inline-grid;place-items:center;width:18px;height:18px;margin-right:8px;border-radius:50%;font-size:10px;font-weight:700;color:#fff;background:#D93025;vertical-align:2px}
.td-r.no em{color:color-mix(in oklab,#D93025 80%,var(--ink))}
/* tour */
.tt-tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:4px;border-radius:14px;background:var(--surface);border:1px solid var(--line-soft);margin-bottom:16px}
.tt-tabs button{position:relative;flex:1 0 auto;border:0;background:none;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;overflow:hidden;white-space:nowrap}
.tt-tabs button[aria-selected="true"]{background:var(--surface-2);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.tt-pr{position:absolute;left:10px;right:10px;bottom:4px;height:2px;border-radius:2px;background:var(--pc);transform:scaleX(0);transform-origin:0 50%}
.tt-tabs button.run .tt-pr{animation:ttRun 6.5s linear forwards}
.tt-tabs button.run.paused .tt-pr{animation-play-state:paused}
@keyframes ttRun{to{transform:scaleX(1)}}
.tt-p{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:clamp(16px,3vw,36px);align-items:center}
@media (max-width:860px){.tt-p{grid-template-columns:1fr}}
.tt-p.in .tt-tx{animation:tdIn .5s cubic-bezier(.2,.8,.2,1) both}
.tt-p.in .tt-shot{animation:ttShot .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes ttShot{from{opacity:0;transform:translateY(16px) scale(.985)}}
.tt-tx{display:grid;gap:8px}
.tt-tx .mono{color:var(--pc)}
.tt-tx b{font-family:var(--display);font-size:clamp(22px,2.4vw,30px);letter-spacing:-.02em;line-height:1.1}
.tt-tx p{margin:0;color:var(--muted);font-size:16px}
.tt-shot{border-radius:14px;overflow:hidden;box-shadow:0 30px 60px -30px color-mix(in oklab,var(--pc) 45%,rgba(0,0,0,.4));border:1px solid var(--line-soft);background:var(--surface-2)}
.tt-shot.narrow{max-width:520px;justify-self:center}
.tt-shot .st-shot{display:block}
@media (prefers-reduced-motion:reduce){.tc-lines.in>div,.td-c.in,.tt-p.in .tt-tx,.tt-p.in .tt-shot,.qx-mic.on .tm-flat{animation:none!important}.tm-flat{stroke-dashoffset:0}}

/* ===== qx5: Tryout v2 ===== */
.qx svg{stroke-linecap:round;stroke-linejoin:round}

.an-tryout{background:#0E0F13}
.an-tryout::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.075) 1px,transparent 1.2px);background-size:2.6cqw 2.6cqw}

.tc4-glow{position:absolute;right:-8cqw;top:18cqh;width:80cqw;height:90cqh;background:radial-gradient(closest-side,rgba(219,5,136,.34),transparent);filter:blur(1cqw);animation:tc4Glow 12s ease-in-out infinite}

@media (prefers-reduced-motion:reduce){.an-tryout *{animation:none!important}.tc4-scan{display:none}}
/* --- pipe (overview) --- */
.tp{position:relative;padding-top:8px}
.tp-rail{position:absolute;left:calc(100%/var(--n)/2);right:calc(100%/var(--n)/2);top:40px;height:3px;border-radius:3px;background:var(--line)}
.tp-fill{position:absolute;inset:0;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--pc),color-mix(in oklab,var(--pc) 55%,#ffb547));border-radius:3px}

/* --- diagonal before/after slider: matched cards --- */
.dg{position:relative;aspect-ratio:16/9;border-radius:24px;overflow:hidden;container-type:inline-size;user-select:none}

.dg-b{background:#E7E8EC}

.dg-a{background:radial-gradient(90% 90% at 70% 30%,#fbe3f1,#f4f1f6 70%);clip-path:polygon(calc(var(--x) + 10%) 0,100% 0,100% 100%,calc(var(--x) - 10%) 100%)}
.dg-ln{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.dg-ln line{stroke:#DB0588;stroke-width:4;vector-effect:non-scaling-stroke}
.dg-knob{position:absolute;left:var(--x);top:50%;transform:translate(-50%,-50%);width:50px;height:50px;border-radius:50%;background:#fff;color:#DB0588;display:grid;place-items:center;font:700 15px var(--body);box-shadow:0 10px 26px -8px rgba(0,0,0,.45);z-index:4;pointer-events:none}
.dg-l{position:absolute;top:18px;padding:8px 14px;border-radius:999px;font:600 13px var(--body);z-index:4;pointer-events:none}
.dg-l.l1{left:18px;background:#14121a;color:#fff}.dg-l.l2{right:18px;background:#DB0588;color:#fff}
.dg input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0;z-index:5}
.dg:has(input:focus-visible) .dg-knob{outline:3px solid #DB0588;outline-offset:3px}
.dc{width:max(270px,46cqw);background:#fff;border-radius:max(14px,1.8cqw);box-shadow:0 3cqw 6cqw -3cqw rgba(30,10,40,.35);padding:max(14px,2.2cqw);display:grid;gap:max(8px,1.3cqw);font:max(11px,1.45cqw)/1.35 var(--body);color:#1b1d24}
.dc-h{display:flex;justify-content:space-between;align-items:center;gap:8px}.dc-h b{font-size:1.15em}
.dc-brand{display:inline-flex;align-items:center;gap:.4em;font-size:.85em;color:#6b7080;font-weight:500}
.dc-logo{display:inline-grid;place-items:center;width:1.6em;height:1.6em;border-radius:.45em;background:#DB0588;color:#fff}.dc-logo svg{width:70%;height:70%}
.dc-tabs{display:flex;gap:.4em}.dc-tabs span{display:inline-flex;align-items:center;gap:.35em;padding:.45em .9em;border-radius:.6em;background:#f2f3f6;font-size:.92em}
.dc-tabs span svg{width:1.1em;height:1.1em;fill:none;stroke:currentColor;stroke-width:2}
.dc-tabs .on{background:#1b1d24;color:#fff}.dg-a .dc-tabs .on{background:#DB0588}
.dc-file{display:flex;align-items:center;gap:.7em;padding:.75em .9em;border-radius:.8em;border:1.5px solid}
.dc-file i{display:grid;place-items:center;width:2em;height:2.4em;border-radius:.35em;color:#fff;font:700 .55em var(--body);font-style:normal;flex:none}
.dc-file span{display:grid;flex:1;min-width:0}.dc-file small{font-size:.85em}
.dc-file em{display:grid;place-items:center;width:1.8em;height:1.8em;border-radius:50%;flex:none}.dc-file em svg{width:60%;height:60%;fill:none;stroke:#fff;stroke-width:3}
.dc-file.no{border-color:#f0b9c0;background:#fdf3f4}.dc-file.no i{background:#9aa0ad}.dc-file.no small{color:#d92d44}.dc-file.no em{background:#E5284F}
.dc-file.ok{border-color:#a8e3c4;background:#effbf4}.dc-file.ok i{background:#E44D26}.dc-file.ok small{color:#178a4f}.dc-file.ok em{background:#1DB36B}
.dc-prev{position:relative;height:max(90px,13cqw);border-radius:.8em;background-size:cover;background-position:50% 18%;border:1px solid #e3e5ea}
.dc-prev.empty{display:grid;place-items:center;background:repeating-linear-gradient(135deg,#f6f7f9 0 10px,#eef0f3 10px 11px);color:#9aa0ad;font-size:.9em}
.dc-goal{position:absolute;left:.6em;bottom:.6em;background:#14121a;color:#fff;font-size:.8em;font-weight:600;padding:.35em .7em;border-radius:999px}
.dc-dot{position:absolute;left:62%;top:46%;width:1.1em;height:1.1em;border-radius:50%;background:#1DB36B;box-shadow:0 0 0 .4em rgba(29,179,107,.3);animation:dcPulse 1.6s ease-in-out infinite}
@keyframes dcPulse{50%{box-shadow:0 0 0 .8em rgba(29,179,107,0)}}
@media (max-width:620px){.dg{aspect-ratio:4/5}.dc{width:84cqw}.dg-l{top:12px}}
/* --- big numbers (results) --- */
.bn{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1.5px solid var(--ink);border-bottom:1px solid var(--line)}

/* --- tech bento --- */
.bt{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;padding:12px;border-radius:24px;background:#0E0F13;background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1.2px);background-size:20px 20px}

.bt-code .c{color:#6b7385}.bt-code .k{color:#ff79c6}.bt-code .s{color:#7ee2a8}.bt-code .n{color:#ffb86c}
.bt-big{font:800 clamp(44px,5vw,64px)/1 var(--display);letter-spacing:-.04em;background:linear-gradient(180deg,#fff,#ff8fd0);-webkit-background-clip:text;background-clip:text;color:transparent}
.bt-chips{display:flex;flex-wrap:wrap;gap:6px}.bt-chips i{font-style:normal;font:500 12px var(--mono);padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.07);color:#d6d9e0}
@media (max-width:900px){.bt{grid-template-columns:1fr 1fr}.bt-t,.bt-t.w{grid-column:span 2}.bt-t.h{grid-row:auto}}
@media (prefers-reduced-motion:reduce){.bn-i,.bt-t{opacity:1;transform:none;transition:none}.dc-dot{animation:none}}
/* --- three decisions --- */
.tr3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:860px){.tr3{grid-template-columns:1fr}}
.tr{position:relative;border-radius:20px;padding:24px;background:var(--surface-2);border:1px solid var(--line-soft);display:grid;gap:8px;align-content:start;opacity:0;transform:translateY(14px);transition:opacity .6s,transform .7s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--k)*.12s)}
.qx-trio.on .tr{opacity:1;transform:none}
.tr-ic{width:48px;height:48px;border-radius:15px;background:color-mix(in oklab,var(--pc) 12%,var(--surface-2));color:var(--pc);display:grid;place-items:center;margin-bottom:6px}
.tr-ic svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8}
.tr-n{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--pc)}

@media (prefers-reduced-motion:reduce){.tr{opacity:1;transform:none;transition:none}}
.bt-t.f{grid-column:1/-1}

.dc-mz{display:inline-grid;place-items:center;width:1.6em;height:1.6em;border-radius:.45em;background:#1b1d24;color:#fff;font-style:normal;font-weight:800;font-size:.9em}
.dc-req{display:grid;gap:.45em;padding:.6em .9em;border-radius:.8em;background:#f6f7f9;border:1px dashed #d5d8df;height:max(90px,13cqw);box-sizing:border-box;align-content:center}
.dc-h.rev{justify-content:flex-start}.dc-h.rev .dc-brand{color:#1b1d24;font-weight:650}

/* ===== qx6: Tryout tech visuals + decision demos ===== */
.yv{position:relative;width:100%;max-width:440px;font:500 12px/1.3 var(--body);color:var(--ink)}
.yv b{font-weight:650}
/* front end: builder three panes */
.yv-fe{display:grid;grid-template-columns:.8fr 1.2fr 1fr;gap:8px;padding:12px;border-radius:14px;background:var(--surface-2,var(--canvas));border:1px solid var(--line-soft);box-shadow:0 18px 40px -24px rgba(0,0,0,.35)}
.yv-pane{border-radius:10px;background:var(--canvas);border:1px solid var(--line-soft);padding:8px;display:grid;gap:6px;align-content:start;min-height:150px}
.yv-pane.l i{height:12px;border-radius:4px;background:color-mix(in oklab,var(--ink) 10%,var(--canvas))}
.yv-pane.l i.on{background:var(--pc)}
.yv-pane.l i.mv{animation:yvMv 4s ease-in-out infinite}
.yv-pane.m b{height:14px;width:60%;border-radius:4px;background:color-mix(in oklab,var(--ink) 22%,var(--canvas))}
.yv-pane.m i{height:9px;border-radius:4px;background:color-mix(in oklab,var(--ink) 9%,var(--canvas))}.yv-pane.m i.s{width:55%}
.yv-btn{height:18px;width:50%;border-radius:6px;background:var(--pc);margin-top:6px}
.yv-pane.r{place-items:center;text-align:center}
.yv-ph{width:62px;height:104px;border-radius:12px;border:2px solid color-mix(in oklab,var(--ink) 30%,var(--canvas));padding:8px 6px;display:grid;gap:5px;align-content:start}
.yv-ph i{height:10px;border-radius:3px;background:color-mix(in oklab,var(--pc) 35%,var(--canvas))}.yv-ph i:last-child{height:30px}
.yv-pane.r em{font:500 10px var(--mono);font-style:normal;color:var(--muted)}
.yv-tag{grid-column:1/-1;justify-self:start;font:600 10.5px var(--mono);letter-spacing:.04em;padding:5px 10px;border-radius:999px;background:color-mix(in oklab,var(--pc) 14%,var(--canvas));color:var(--pc)}
@keyframes yvMv{0%,100%{transform:none}50%{transform:translateY(-18px)}}
/* tracker */
.yv-tr{display:grid;grid-template-columns:1fr 1.25fr;gap:12px;align-items:center}
.yv-proto{position:relative;aspect-ratio:3/4;border-radius:14px;background:var(--canvas);border:1px solid var(--line-soft);box-shadow:0 18px 40px -24px rgba(0,0,0,.35)}
.yv-proto span[class^=yv-b]{position:absolute;left:12%;right:12%;height:13%;border-radius:8px;background:color-mix(in oklab,var(--ink) 8%,var(--canvas))}
.yv-b1{top:12%}.yv-b2{top:32%;background:color-mix(in oklab,var(--pc) 22%,var(--canvas))!important}.yv-b3{bottom:10%;height:11%!important;background:var(--pc)!important}
.yv-cur{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--ink);border:2px solid var(--canvas);left:70%;top:60%;animation:yvCur 6s ease-in-out infinite}
.yv-rip{position:absolute;width:22px;height:22px;margin:-5px 0 0 -5px;border-radius:50%;opacity:0}
.yv-rip.r1{left:70%;top:60%;border:2px solid #E5284F;animation:yvRip 6s 0s infinite}
.yv-rip.r2{left:50%;top:84%;border:2px solid #1DB36B;animation:yvRip 6s 3s infinite}
@keyframes yvCur{0%,10%{left:70%;top:60%}40%,55%{left:45%;top:38%}80%,100%{left:50%;top:84%}}
@keyframes yvRip{0%,8%{opacity:0;transform:scale(.4)}12%{opacity:1}30%,100%{opacity:0;transform:scale(1.8)}}
.yv-log{list-style:none;margin:0;padding:10px;border-radius:12px;background:#14121a;color:#e9e9ef;display:grid;gap:6px;font:500 11px/1.3 var(--mono)}
.yv-log li{display:flex;gap:8px;opacity:.35;animation:yvLog 6s infinite;animation-delay:calc(var(--i,0)*.9s)}
.yv-log li:nth-child(1){--i:0}.yv-log li:nth-child(2){--i:1}.yv-log li:nth-child(3){--i:2}.yv-log li:nth-child(4){--i:3}.yv-log li:nth-child(5){--i:4}
.yv-log b{color:#8b8d99;font-weight:500;min-width:40px}.yv-log .bad{color:#ff8a9c}.yv-log .ok{color:#7be0ad}
@keyframes yvLog{0%{opacity:.35}6%,85%{opacity:1}100%{opacity:.35}}
/* statistics */
.yv-st{display:grid;gap:12px}
.yv-axis{position:relative;height:56px;border-radius:12px;background:var(--canvas);border:1px solid var(--line-soft)}
.yv-axis i{position:absolute;bottom:4px;font:500 10px var(--mono);font-style:normal;color:var(--muted)}.yv-axis i:nth-of-type(1){left:8px}.yv-axis i:nth-of-type(2){left:50%;transform:translateX(-50%)}.yv-axis i:nth-of-type(3){right:8px}
.yv-band{position:absolute;top:14px;height:16px;border-radius:999px;background:color-mix(in oklab,var(--pc) 30%,var(--canvas));left:30%;right:22%;animation:yvBand 6s ease-in-out infinite}
.yv-pt{position:absolute;top:12px;left:62%;width:4px;height:20px;border-radius:2px;background:var(--pc)}
@keyframes yvBand{0%,15%{left:30%;right:22%}35%,40%{left:42%;right:28%}60%,65%{left:50%;right:31%}85%,100%{left:55%;right:33%}}
.yv-ns{display:flex;justify-content:space-between;font:500 10.5px var(--mono);color:var(--muted)}
.yv-ns span{animation:yvN 6s infinite}.yv-ns span:nth-child(2){animation-delay:1.5s}.yv-ns span:nth-child(3){animation-delay:3s}.yv-ns span:nth-child(4){animation-delay:4.5s}
@keyframes yvN{0%,20%{color:var(--pc)}25%,100%{color:var(--muted)}}
.yv-chips{display:flex;flex-wrap:wrap;gap:6px}.yv-chips i{font-style:normal;padding:5px 10px;border-radius:999px;border:1px solid var(--line-soft);background:var(--canvas);font-weight:600}

.yv-db{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.yv-tb,.yv-bucket{border-radius:12px;background:var(--canvas);border:1px solid var(--line-soft);padding:12px;display:grid;gap:6px;align-content:start}
.yv-tb em,.yv-bucket em{justify-self:start;font:600 10px var(--mono);font-style:normal;padding:3px 8px;border-radius:999px;background:color-mix(in oklab,var(--pc) 14%,var(--canvas));color:var(--pc)}
.yv-tb i{height:8px;border-radius:3px;background:color-mix(in oklab,var(--ink) 9%,var(--canvas))}

.yv-who{grid-column:1/-1;display:grid;gap:6px}

.yv-who i::before{content:"";width:8px;height:8px;border-radius:50%;background:#1DB36B}.yv-who i.t::before{background:#E5284F}
/* ship */
.yv-ship{display:grid;grid-template-columns:auto 1fr auto 1fr auto 1fr auto;align-items:center;gap:6px}
.yv-s{display:grid;gap:6px;justify-items:center;text-align:center;font-size:11px}
