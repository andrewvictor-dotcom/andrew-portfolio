<meta name="description" content="Andrew Victor — Product Designer. Product designer at WideBot in Cairo. I design the tools businesses use to build chatbots and answer their customers on WhatsApp and Facebook, and I start every design with real users."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&family=Archivo:wdth,wght@62..125,400..900&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Rubik:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,400,0..1,0&display=swap"><style id="css">
:root{
  --canvas:#E8EBF0; --surface:#F7F8FA; --surface-2:#FFFFFF; --ink:#101218; --muted:#586072; --line:#D2D7E0; --line-soft:#DDE1E8;
  --accent:#2F55F4; --accent-ink:#FFFFFF; --redline:#F2386A; --dot:#B9C0CC; --shadow:0 1px 2px rgba(16,18,24,.06),0 12px 32px -12px rgba(16,18,24,.18);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --gutter:clamp(16px,4vw,48px); --maxw:1240px;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --canvas:#0D0F13; --surface:#15181E; --surface-2:#1B1F27; --ink:#ECEEF3; --muted:#9299A8; --line:#2A2F3A; --line-soft:#232730;
    --accent:#6F8BFF; --accent-ink:#0B0D12; --redline:#FF5C88; --dot:#2E343F; --shadow:0 1px 2px rgba(0,0,0,.4),0 16px 40px -16px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --canvas:#0D0F13; --surface:#15181E; --surface-2:#1B1F27; --ink:#ECEEF3; --muted:#9299A8; --line:#2A2F3A; --line-soft:#232730;
  --accent:#6F8BFF; --accent-ink:#0B0D12; --redline:#FF5C88; --dot:#2E343F; --shadow:0 1px 2px rgba(0,0,0,.4),0 16px 40px -16px rgba(0,0,0,.7);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
[hidden]{display:none!important}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
::selection{background:var(--accent);color:var(--accent-ink)}
.wrap{max-width:var(--maxw);margin:0 auto;padding-inline:var(--gutter)}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.02em}

/* progress */
.progress{position:fixed;top:0;left:0;right:0;height:2px;background:var(--accent);transform-origin:0 50%;transform:scaleX(0);z-index:60}
@supports (animation-timeline:scroll()){.progress{animation:grow linear both;animation-timeline:scroll(root)}}
@keyframes grow{to{transform:scaleX(1)}}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;padding-block:14px}
.nav-in{display:flex;align-items:center;gap:16px;justify-content:space-between;background:color-mix(in oklab,var(--surface) 78%,transparent);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border:1px solid var(--line-soft);border-radius:14px;padding:8px 8px 8px 14px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:600}
.logo-mark{width:30px;height:30px;border-radius:8px;background:var(--ink);color:var(--canvas);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:-.02em}
.logo small{color:var(--muted);font-weight:400;font-size:13px}
.nav-links{display:flex;gap:4px}
.nav-links a{text-decoration:none;font-size:14px;padding:8px 12px;border-radius:9px;color:var(--muted);transition:color .2s,background .2s}
.nav-links a:hover{color:var(--ink);background:var(--line-soft)}
.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;border:0;cursor:pointer;font-weight:500;font-size:15px;border-radius:12px;padding:12px 18px;transition:transform .25s cubic-bezier(.2,.8,.2,1),background .2s,box-shadow .2s;will-change:transform}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 24px -10px var(--accent)}
.btn.dark{background:var(--ink);color:var(--canvas)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.ghost:hover{background:var(--surface)}
.btn.sm{padding:9px 14px;font-size:14px;border-radius:10px}
.btn svg{width:16px;height:16px}
@media (max-width:640px){.logo small,.nav .nav-cta{display:none}.nav-links a{padding:8px 8px;font-size:13px}}

/* hero */
.hero{position:relative;padding-block:clamp(40px,8vw,96px) clamp(40px,6vw,72px);overflow:hidden}
#dots{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.hero .wrap{position:relative}
.status{display:inline-flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line-soft);padding:6px 12px 6px 10px;border-radius:999px}
.pulse{width:8px;height:8px;border-radius:50%;background:#1DB36B;box-shadow:0 0 0 0 rgba(29,179,107,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(29,179,107,0)}100%{box-shadow:0 0 0 0 rgba(29,179,107,0)}}
.sel{position:relative;display:inline-block;margin-top:28px;max-width:100%}
.headline{font-family:var(--display);font-weight:760;font-size:clamp(40px,7.4vw,96px);line-height:.98;letter-spacing:-.035em;margin:0;max-width:14ch;text-wrap:balance;font-variation-settings:"opsz" 96}
.headline .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em;margin-bottom:-.08em}
.headline .w>span{display:inline-block;animation:wordUp .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 55ms + 150ms)}
.headline em{font-style:normal;color:var(--accent);position:relative}
@keyframes wordUp{from{transform:translateY(105%)}to{transform:none}}
.no-intro .headline .w>span{animation:none}
.selbox{position:absolute;inset:-12px -14px;border:1.5px solid var(--accent);pointer-events:none;clip-path:inset(0 0 0 0)}
.selbox i{position:absolute;width:9px;height:9px;background:var(--surface-2);border:1.5px solid var(--accent)}
.selbox i:nth-child(1){left:-5px;top:-5px}.selbox i:nth-child(2){right:-5px;top:-5px}.selbox i:nth-child(3){left:-5px;bottom:-5px}.selbox i:nth-child(4){right:-5px;bottom:-5px}
.sel-tag{position:absolute;left:-1.5px;top:-34px;background:var(--accent);color:var(--accent-ink);font-family:var(--mono);font-size:11px;padding:3px 7px;border-radius:4px 4px 4px 0;white-space:nowrap}
.dims{position:absolute;left:50%;bottom:-38px;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);font-family:var(--mono);font-size:11px;padding:3px 7px;border-radius:4px;white-space:nowrap;font-variant-numeric:tabular-nums}
.lede{font-size:clamp(17px,1.6vw,19px);color:var(--muted);max-width:58ch;margin:56px 0 0;text-wrap:pretty}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px;align-items:center}
.find{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:22px}
.find>.mono{color:var(--muted)}
.socials{display:flex;gap:8px;flex-wrap:wrap}
.social{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:var(--ink);text-decoration:none;padding:8px 12px 8px 14px;border-radius:999px;background:var(--surface-2);border:1px solid color-mix(in oklab,var(--ink) 22%,transparent);transition:background .2s,color .2s,border-color .2s,transform .2s}
.social svg{width:14px;height:14px;transition:transform .25s}
.social:hover{background:var(--ink);color:var(--canvas);border-color:var(--ink)}
.social:hover svg{transform:translate(2px,-2px)}
.contact .social{background:transparent;color:var(--canvas);border-color:color-mix(in oklab,var(--canvas) 35%,var(--ink))}
.contact .social:hover{background:var(--canvas);color:var(--ink);border-color:var(--canvas)}

/* work strip */
.shots{display:grid;gap:16px;overflow:hidden;padding-block:4px clamp(40px,6vw,64px)}
.shots-lane{overflow:hidden}
.shots-lane.l{animation:laneL 1.4s cubic-bezier(.2,.8,.2,1) .5s both}
.shots-lane.r{animation:laneR 1.4s cubic-bezier(.2,.8,.2,1) .65s both}
.no-intro .shots-lane{animation:none}
@keyframes laneL{from{translate:45% 0;opacity:0}}
@keyframes laneR{from{translate:-45% 0;opacity:0}}
.shots-row{display:flex;gap:16px;width:max-content;will-change:transform;padding-block:6px}
.shot{position:relative;flex:none;width:clamp(240px,30vw,420px);aspect-ratio:16/10;border-radius:14px;overflow:hidden;background:color-mix(in oklab,var(--pc) 16%,var(--surface));border:1px solid var(--line-soft);cursor:pointer;padding:0;display:block;transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s}
.shot img{width:100%;height:100%;object-fit:cover}
.shots[data-shape="16/10"] .shot{aspect-ratio:16/10}
.shots[data-shape="4/3"] .shot{aspect-ratio:4/3;width:clamp(240px,28vw,400px)}
.shots[data-shape="auto"] .shot{aspect-ratio:auto;width:auto;height:clamp(190px,22vw,300px)}
.shots[data-shape="auto"] .shot img{width:auto;height:100%;max-width:none}
.shots-head{width:100%;display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.shots-head .mono{color:var(--muted)}
.shots-empty{border:1.5px dashed var(--line);border-radius:16px;padding:22px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;color:var(--muted);font-size:14px}
.chk{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:500;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.irow .sz{font-family:var(--mono);font-size:11px;color:var(--muted)}
.shot:hover{transform:translateY(-6px);box-shadow:0 24px 40px -24px color-mix(in oklab,var(--pc) 70%,transparent)}
.shot .lbl{position:absolute;left:10px;bottom:10px;display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);color:var(--ink);font-size:12px;font-weight:500;padding:6px 10px;border-radius:8px;box-shadow:var(--shadow);opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s}
.shot .lbl i{width:8px;height:8px;border-radius:2px;background:var(--pc)}
.shot:hover .lbl,.shot:focus-visible .lbl{opacity:1;transform:none}
.chip-float{position:absolute;z-index:2;display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line-soft);box-shadow:var(--shadow);border-radius:12px;padding:10px 12px;font-size:13px;white-space:nowrap;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.chip-float b{font-family:var(--display);font-size:20px;letter-spacing:-.02em}
.cf1>span:last-child{white-space:normal;max-width:190px;line-height:1.35}
.chip-float .sw{width:22px;height:22px;border-radius:6px;background:var(--accent)}
.chip-float .al{display:grid;grid-template-columns:repeat(3,6px);gap:3px}
.chip-float .al span{height:6px;background:var(--muted);border-radius:2px;opacity:.6}
.cf1{right:4%;top:18%;animation:bob 6s ease-in-out infinite}
.cf2{right:14%;top:56%;animation:bob 7s ease-in-out -2s infinite}
.cf3{right:2%;top:78%;animation:bob 8s ease-in-out -4s infinite}
@keyframes bob{50%{translate:0 -10px}}
@media (max-width:1080px){.chip-float{display:none}}
.bot{position:absolute;left:0;top:0;z-index:5;pointer-events:none;opacity:0}
.bot svg{width:22px;height:22px;display:block;filter:drop-shadow(0 2px 4px rgba(0,0,0,.2))}
.bot .tag{position:absolute;left:16px;top:18px;background:var(--redline);color:#fff;font-size:12px;font-weight:500;padding:3px 8px;border-radius:4px 10px 10px 10px;white-space:nowrap}
.bot .chat{position:absolute;left:16px;top:44px;background:var(--redline);color:#fff;font-size:13px;padding:8px 12px;border-radius:4px 14px 14px 14px;white-space:nowrap;opacity:0;transform:translateY(-4px) scale(.96);transition:opacity .3s,transform .3s}
.bot.talk .chat{opacity:1;transform:none}
.ripple{position:absolute;width:12px;height:12px;border-radius:50%;border:2px solid var(--redline);pointer-events:none;z-index:4;animation:rip .6s ease-out forwards}
@keyframes rip{to{transform:scale(5);opacity:0}}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat{padding:28px 20px 28px 0;display:grid;gap:4px;align-content:start}
.stat+.stat{padding-left:20px;border-left:1px solid var(--line)}
.stat b{font-family:var(--display);font-weight:700;font-size:clamp(34px,4vw,52px);letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:14px;max-width:24ch}
@media (max-width:760px){.stats{grid-template-columns:1fr 1fr}.stat:nth-child(3){padding-left:0;border-left:0}.stat:nth-child(n+3){border-top:1px solid var(--line)}}

/* section */
section.block{padding-block:clamp(64px,9vw,120px)}
.frame-name{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-family:var(--mono);font-size:12px}
.frame-name svg{width:12px;height:12px}
.h2{font-family:var(--display);font-weight:720;font-size:clamp(32px,4.6vw,60px);letter-spacing:-.03em;line-height:1.02;margin:12px 0 0;text-wrap:balance}
.sub{color:var(--muted);max-width:56ch;margin:14px 0 0;font-size:17px}
.sec-head{display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:end;margin-bottom:40px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer;color:var(--muted);transition:all .2s}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--canvas);border-color:var(--ink)}

/* cards */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(20px,3vw,36px)}
.grid .card:first-child,.grid .card:last-child:nth-child(even){grid-column:1/-1}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
.card{position:relative;cursor:pointer;perspective:1200px;display:flex;flex-direction:column;gap:10px}
.card .flabel{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-family:var(--mono);font-size:12px}
.card .flabel span:first-child{display:flex;align-items:center;gap:6px;color:var(--ink)}
.card .flabel svg{width:12px;height:12px;color:var(--pc)}
.cover{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:16/10;max-width:100%;background:color-mix(in oklab,var(--pc) 16%,var(--surface));border:1px solid var(--line-soft);transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.8,.2,1),box-shadow .5s;box-shadow:0 0 0 0 transparent}
.grid .card:first-child .cover,.grid .card:last-child:nth-child(even) .cover{aspect-ratio:21/9}
@media (max-width:760px){.grid .card:first-child .cover,.grid .card:last-child:nth-child(even) .cover{aspect-ratio:16/10}}
.card:hover .cover{box-shadow:0 30px 60px -30px color-mix(in oklab,var(--pc) 60%,transparent);outline:1.5px solid var(--pc);outline-offset:-1.5px}
.cover img.real{width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.card:hover .cover img.real,.card:hover .mock{transform:scale(1.035)}
.shine{position:absolute;inset:0;background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.22),transparent 45%);opacity:0;transition:opacity .3s;pointer-events:none;mix-blend-mode:soft-light}
.card:hover .shine{opacity:1}
.rl{position:absolute;pointer-events:none;opacity:0;transition:opacity .3s}
.card:hover .rl{opacity:1}
.rl.h{left:0;right:0;top:50%;height:1px;background:var(--redline)}
.rl.v{top:0;bottom:0;left:50%;width:1px;background:var(--redline)}
.rl b{position:absolute;background:var(--redline);color:#fff;font:500 10px/1 var(--mono);padding:3px 5px;border-radius:3px;white-space:nowrap}
.rl.h b{left:12px;top:-8px}.rl.v b{top:12px;left:-14px}
.card-body{display:grid;gap:6px;padding-top:6px}
.card h3{font-family:var(--display);font-weight:680;font-size:clamp(22px,2.2vw,28px);letter-spacing:-.02em;line-height:1.1;margin:0}
.card p{margin:0;color:var(--muted);max-width:62ch}
.card .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.metric{display:inline-flex;align-items:baseline;gap:8px;font-size:14px;color:var(--muted)}
.metric b{font-family:var(--display);font-size:22px;color:var(--pc);letter-spacing:-.02em}
.open{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500}
.open svg{width:16px;height:16px;transition:transform .3s}
.card:hover .open svg{transform:translateX(4px)}

/* mocks */
.mock{position:absolute;inset:0;transition:transform .8s cubic-bezier(.2,.8,.2,1);--pcs:color-mix(in oklab,var(--pc) 70%,var(--surface-2))}
.m-win{position:absolute;left:8%;right:8%;top:14%;bottom:-6%;background:var(--surface-2);border-radius:12px 12px 0 0;box-shadow:var(--shadow);display:grid;grid-template-columns:18% 1fr;overflow:hidden}
.m-side{background:color-mix(in oklab,var(--pc) 8%,var(--surface));padding:14% 12%;display:grid;gap:9%;align-content:start}
.m-side i,.m-bar,.m-line{display:block;height:7px;border-radius:4px;background:var(--line)}
.m-side i:first-child{background:var(--pc);width:60%}
.m-main{padding:5%;display:grid;gap:5%;align-content:start}
.m-bar{width:40%;height:10px;background:var(--ink);opacity:.8}
.m-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:4%}
.m-tiles div{aspect-ratio:1.8;border-radius:8px;border:1px solid var(--line-soft);padding:8%;display:grid;align-content:space-between}
.m-tiles div b{display:block;height:9px;width:50%;border-radius:3px;background:var(--pc)}
.m-chart{height:auto;width:100%}
.m-chart polyline{fill:none;stroke:var(--pc);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.m-chart path{fill:color-mix(in oklab,var(--pc) 18%,transparent)}
.phone{position:absolute;width:26%;aspect-ratio:9/19;border-radius:22px;background:var(--ink);padding:1.2%;box-shadow:var(--shadow)}
.phone .scr{width:100%;height:100%;border-radius:18px;background:var(--surface-2);padding:14% 9%;display:grid;gap:5%;align-content:start;overflow:hidden}
.phone .scr .hd{height:10%;border-radius:8px;background:var(--pc)}
.phone .scr .it{display:grid;grid-template-columns:28% 1fr;gap:8%;align-items:center}
.phone .scr .it span{aspect-ratio:1;border-radius:6px;background:color-mix(in oklab,var(--pc) 30%,var(--surface))}
.phone .scr .it i{height:6px;border-radius:3px;background:var(--line)}
.p1{left:22%;top:12%;transform:rotate(-8deg)}
.p2{left:50%;top:6%;transform:rotate(6deg)}
.m-form{position:absolute;left:50%;top:12%;width:38%;transform:translateX(-50%);background:var(--surface-2);border-radius:14px;box-shadow:var(--shadow);padding:5%;display:grid;gap:10px}
.m-steps{display:flex;gap:6px}.m-steps i{flex:1;height:4px;border-radius:2px;background:var(--pc)}.m-steps i:last-child{background:var(--line)}
.m-field{height:22px;border-radius:6px;border:1px solid var(--line)}
.m-btn{height:24px;border-radius:7px;background:var(--pc)}
.m-chat{position:absolute;left:6%;right:6%;top:12%;bottom:-6%;background:var(--surface-2);border-radius:12px 12px 0 0;box-shadow:var(--shadow);display:grid;grid-template-columns:34% 1fr;overflow:hidden}
.m-list{border-right:1px solid var(--line-soft);padding:6% 7%;display:grid;gap:8%;align-content:start}
.m-list div{display:grid;grid-template-columns:18px 1fr;gap:8px;align-items:center}
.m-list div span{width:18px;height:18px;border-radius:50%;background:color-mix(in oklab,var(--pc) 40%,var(--surface))}
.m-list div:first-child{background:color-mix(in oklab,var(--pc) 12%,transparent);border-radius:6px;padding:4px;margin:-4px}
.m-conv{padding:6%;display:flex;flex-direction:column;gap:10px}
.bub{height:22px;border-radius:12px;background:var(--line-soft);width:55%}
.bub.me{align-self:flex-end;background:var(--pc);width:45%}
.m-hub{position:absolute;inset:0}
.m-hub svg{width:100%;height:100%}
.m-hub line{stroke:var(--pc);stroke-width:1.5;stroke-dasharray:4 5;animation:dash 1.6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-18}}
.m-hub circle.c{fill:var(--pc)}
.m-hub circle.n{fill:var(--surface-2);stroke:var(--line)}
.m-apps{position:absolute;left:10%;right:10%;top:14%;display:grid;grid-template-columns:repeat(4,1fr);gap:4%}
.m-apps div{background:var(--surface-2);border-radius:10px;box-shadow:var(--shadow);padding:10%;display:grid;gap:8px;aspect-ratio:1}
.m-apps div span{width:36%;aspect-ratio:1;border-radius:8px;background:color-mix(in oklab,var(--pc) 40%,var(--surface))}
.m-apps div em{height:14px;width:70%;border-radius:7px;background:var(--pc);align-self:end}
.m-apps div:nth-child(odd) em{background:var(--line)}
.m-wallet{position:absolute;left:50%;top:14%;transform:translateX(-50%);width:46%;display:grid;gap:10px}
.m-wallet .bal{height:70px;border-radius:14px;background:linear-gradient(135deg,var(--pc),color-mix(in oklab,var(--pc) 50%,var(--ink)));box-shadow:var(--shadow)}
.m-wallet .ad{background:var(--surface-2);border-radius:10px;height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;box-shadow:var(--shadow)}
.m-wallet .ad i{width:40%;height:6px;border-radius:3px;background:var(--line)}
.m-wallet .ad b{width:26px;height:15px;border-radius:8px;background:var(--pc);position:relative}
.m-wallet .ad b::after{content:"";position:absolute;right:2px;top:2px;width:11px;height:11px;border-radius:50%;background:#fff}
.m-wallet .ad.off b{background:var(--line)}.m-wallet .ad.off b::after{right:auto;left:2px}

/* experience */
.xp{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:clamp(28px,5vw,72px)}
@media (max-width:900px){.xp{grid-template-columns:1fr}}
.timeline{display:grid;gap:0;border-left:1px solid var(--line);margin-left:6px}
.job{position:relative;padding:0 0 40px 28px}
.job::before{content:"";position:absolute;left:-6px;top:6px;width:11px;height:11px;border-radius:50%;background:var(--canvas);border:2px solid var(--accent)}
.job:first-child::before{background:var(--accent)}
.job .per{font-family:var(--mono);font-size:12px;color:var(--muted)}
.job h3{font-family:var(--display);font-size:24px;letter-spacing:-.02em;margin:4px 0 0;line-height:1.2}
.job .at{color:var(--muted);font-size:15px;margin-top:2px}
.job ul{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:10px}
.job li{position:relative;padding-left:18px;max-width:62ch}
.job li::before{content:"";position:absolute;left:0;top:.7em;width:8px;height:1.5px;background:var(--accent)}
.side-card{background:var(--surface);border:1px solid var(--line-soft);border-radius:16px;padding:22px;display:grid;gap:12px}
.side-stack{display:grid;gap:16px;align-content:start}
.side-card h4{margin:0;font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.04em;text-transform:uppercase}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:13px;padding:5px 10px;border-radius:8px;background:var(--canvas);border:1px solid var(--line-soft)}
.edu b{display:block;font-family:var(--display);font-size:18px}
.edu span{color:var(--muted);font-size:14px}

/* about */
.about{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(28px,5vw,72px);align-items:start}
@media (max-width:900px){.about{grid-template-columns:1fr}}
.portrait{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:4/5;max-width:100%;background:var(--surface);border:1px solid var(--line-soft)}
.portrait img{width:100%;height:100%;object-fit:cover}
.portrait .ph{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:clamp(80px,12vw,160px);letter-spacing:-.05em;color:var(--accent);background:repeating-linear-gradient(135deg,transparent 0 14px,color-mix(in oklab,var(--accent) 8%,transparent) 14px 15px)}
.portrait .cap{position:absolute;left:12px;bottom:12px;background:var(--surface-2);border-radius:8px;padding:6px 10px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.prose p{margin:0 0 16px;max-width:62ch;font-size:17px}
.prose h3{font-family:var(--display);font-size:22px;letter-spacing:-.02em;margin:32px 0 10px}

/* testimonials */
.marquee{overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.track{display:flex;gap:20px;width:max-content;animation:slide var(--dur,70s) linear infinite;padding-block:6px}
.marquee:hover .track{animation-play-state:paused}
@keyframes slide{to{transform:translateX(-50%)}}
.quote{width:min(420px,82vw);background:var(--surface);border:1px solid var(--line-soft);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:18px}
.quote p{margin:0;font-size:15px;line-height:1.65}
.quote p::before{content:"\201C";font-family:var(--display);font-size:44px;line-height:0;display:block;height:18px;color:var(--accent)}
.who{display:flex;gap:12px;align-items:center;margin-top:auto}
.av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;font-size:14px;color:#fff;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.who b{display:block;font-size:15px}.who span{font-size:13px;color:var(--muted)}

/* contact */
.contact{position:relative;background:var(--ink);color:var(--canvas);border-radius:28px;padding:clamp(36px,7vw,88px) clamp(20px,6vw,80px);overflow:hidden;display:grid;grid-template-columns:minmax(0,1.4fr) auto;gap:32px;align-items:center}
@media (max-width:820px){.contact{grid-template-columns:1fr}}
.contact .h2{color:var(--canvas);margin:0;font-size:clamp(36px,5.6vw,76px)}
.contact p{color:color-mix(in oklab,var(--canvas) 70%,var(--ink));margin:16px 0 0;font-size:18px}
.contact .mail{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:28px}
.contact .mail code{font-family:var(--mono);font-size:15px;background:color-mix(in oklab,var(--canvas) 10%,var(--ink));padding:10px 14px;border-radius:10px;user-select:all}
.contact .btn.ghost{border-color:color-mix(in oklab,var(--canvas) 25%,var(--ink));color:var(--canvas)}
.contact .btn.ghost:hover{background:color-mix(in oklab,var(--canvas) 10%,var(--ink))}
.orb{position:relative;width:200px;height:200px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;text-decoration:none;font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.01em;justify-self:center;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.orb svg.ring{position:absolute;inset:-26px;width:252px;height:252px;animation:spin 18s linear infinite}
.orb svg.ring text{font:500 11px var(--mono);letter-spacing:.28em;fill:var(--canvas);text-transform:uppercase}
@keyframes spin{to{transform:rotate(360deg)}}
.contact .glow{position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,color-mix(in oklab,var(--accent) 45%,transparent),transparent 65%);right:-160px;top:-200px;pointer-events:none;opacity:.55}

footer{padding-block:40px 56px;color:var(--muted);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between}
footer nav{display:flex;gap:14px;flex-wrap:wrap}
footer a{text-decoration:none;color:var(--ink);font-weight:500}footer a:hover{text-decoration:underline;text-underline-offset:3px}

/* reveal (scroll-driven, visible when unsupported) */
@supports (animation-timeline:view()){
  .reveal{animation:rise linear both;animation-timeline:view();animation-range:entry 0% entry 35%}
}
@keyframes rise{from{opacity:.001;transform:translateY(48px) scale(.985)}to{opacity:1;transform:none}}

/* you cursor */
.you{position:fixed;left:0;top:0;z-index:90;pointer-events:none;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:500;padding:3px 8px;border-radius:4px 10px 10px 10px;white-space:nowrap;opacity:0;transition:opacity .25s,background .25s,padding .25s}
.you.on{opacity:1}
.you.big{padding:8px 12px;font-size:13px}

/* case study overlay */
.cs{position:fixed;inset:0;z-index:70;background:var(--canvas);overflow-y:auto;overscroll-behavior:contain;padding-top:env(safe-area-inset-top,0px)}
.cs-bar{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px var(--gutter);background:color-mix(in oklab,var(--canvas) 85%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line-soft)}
.cs-bar .crumb{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.cs-bar .right{display:flex;gap:8px}
.back{display:inline-flex;align-items:center;gap:8px;font-weight:500;font-size:14px;padding:9px 14px 9px 11px;border-radius:10px;background:var(--ink);color:var(--canvas);border:0;cursor:pointer;white-space:nowrap;transition:transform .2s}
.back svg{width:16px;height:16px;transition:transform .25s}
.back:hover svg{transform:translateX(-3px)}
@media (max-width:640px){.cs-bar .crumb,.cs-bar .nx{display:none}}
.cs .cover button.zoom{all:unset;position:absolute;inset:0;cursor:zoom-in}
.media-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}
.stage .media-grid{margin-top:10px}
.fig{margin:0;display:grid;gap:8px;align-content:start;grid-column:span 6}
.fig.l-half{grid-column:span 3}
.fig.l-phone{grid-column:span 2}
@media (max-width:700px){.fig.l-half{grid-column:span 6}.fig.l-phone{grid-column:span 3}}
.fig .zoom{padding:0;border:1px solid var(--line-soft);border-radius:12px;overflow:hidden;background:var(--surface-2);cursor:zoom-in;display:block;width:100%}
.fig .zoom img{width:100%;height:auto;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.fig .zoom:hover img{transform:scale(1.02)}
.fig figcaption{font-size:14px;color:var(--muted);max-width:60ch}
.showcase{padding-block:56px;border-bottom:1px solid var(--line-soft)}
.showcase-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.showcase-head h2{font-family:var(--display);font-size:clamp(28px,3.6vw,44px);letter-spacing:-.025em;margin:6px 0 0;line-height:1.05}
.showcase-head .mono{color:var(--muted)}
.empty-vis{border:1.5px dashed var(--line);border-radius:16px;padding:28px;display:grid;gap:10px;justify-items:start;color:var(--muted)}
@supports (animation-timeline:view()){
  .slide-l{animation:slideL linear both;animation-timeline:view();animation-range:entry 0% entry 45%}
  .slide-r{animation:slideR linear both;animation-timeline:view();animation-range:entry 0% entry 45%}
}
@keyframes slideL{from{opacity:.001;transform:translateX(-90px) rotate(-1.5deg)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:.001;transform:translateX(90px) rotate(1.5deg)}to{opacity:1;transform:none}}
.next-row{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding-block:32px 0}

/* lightbox */
.lb{position:fixed;inset:0;z-index:92;background:rgba(7,8,11,.94);display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color:#fff;animation:fadeIn .25s ease both}
@keyframes fadeIn{from{opacity:0}}
.lb-top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px}
.lb-top .mono{color:#aab0bd}
.lb-x{background:#fff;color:#0b0d12;border:0;border-radius:10px;padding:8px 14px;font-weight:500;cursor:pointer}
.lb-stage{display:grid;place-items:center;padding:0 clamp(16px,6vw,72px);min-height:0}
.lb-stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;animation:lbIn .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes lbIn{from{opacity:0;transform:scale(.96)}}
.lb-cap{color:#cfd3dc;text-align:center;padding:12px 16px 20px;font-size:14px;min-height:20px}
.lb-nav{position:absolute;top:50%;translate:0 -50%;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font-size:22px;cursor:pointer;display:grid;place-items:center}
.lb-nav:hover{background:rgba(255,255,255,.18)}
.lb-nav.prev{left:12px}.lb-nav.next{right:12px}
.cs-hero{padding-block:48px 32px}
.cs-hero .kicker{font-family:var(--mono);font-size:12px;color:var(--pc)}
.cs-hero h1{font-family:var(--display);font-weight:760;font-size:clamp(38px,6.4vw,84px);letter-spacing:-.035em;line-height:1;margin:12px 0 0;max-width:16ch;text-wrap:balance}
.cs-hero .sum{font-size:clamp(18px,1.8vw,21px);color:var(--muted);max-width:60ch;margin:20px 0 0;text-wrap:pretty}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:36px}
.facts div{padding:16px 16px 16px 0}
.facts div+div{padding-left:16px;border-left:1px solid var(--line)}
.facts dt{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.facts dd{margin:4px 0 0;font-weight:500}
.cs .cover{aspect-ratio:16/8;margin-top:8px}
.cs-sec{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:clamp(20px,4vw,64px);padding-block:48px;border-bottom:1px solid var(--line-soft)}
@media (max-width:820px){.cs-sec{grid-template-columns:1fr}}
.cs-sec h2{font-family:var(--display);font-size:26px;letter-spacing:-.02em;margin:0;line-height:1.15}
.cs-sec .prose p{font-size:18px}
.stages{display:grid;gap:14px;counter-reset:st}
.stage{background:var(--surface);border:1px solid var(--line-soft);border-radius:16px;padding:22px 24px;display:grid;gap:8px}
.stage .n{font-family:var(--mono);font-size:12px;color:var(--pc)}
.stage h3{margin:0;font-family:var(--display);font-size:21px;letter-spacing:-.015em}
.stage p{margin:0;max-width:66ch}
.stage .val{margin-top:6px;padding:12px 14px;border-radius:10px;background:color-mix(in oklab,var(--pc) 10%,var(--canvas));font-size:15px}
.stage .val b{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--pc);font-weight:500;margin-bottom:2px}
.big-metric{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.big-metric b{font-family:var(--display);font-size:clamp(64px,10vw,128px);letter-spacing:-.05em;line-height:.9;color:var(--pc)}
.big-metric span{font-size:18px;color:var(--muted);max-width:28ch}
.gallery{display:grid;gap:16px;padding-block:48px}
.gallery img{border-radius:14px;border:1px solid var(--line-soft);width:100%}
.next{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding-block:48px 80px}
.next button{background:none;border:0;cursor:pointer;text-align:left;padding:0}
.next small{font-family:var(--mono);color:var(--muted);font-size:12px}
.next strong{display:block;font-family:var(--display);font-size:clamp(28px,4vw,44px);letter-spacing:-.02em;line-height:1.1}
.cs-in>*{animation:csIn .7s cubic-bezier(.2,.8,.2,1) both}
.cs-in>*:nth-child(2){animation-delay:.08s}.cs-in>*:nth-child(3){animation-delay:.16s}.cs-in>*:nth-child(4){animation-delay:.24s}
@keyframes csIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}

/* admin */
.admin-fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:80;display:flex;gap:8px;align-items:center}
.admin-fab .btn{box-shadow:var(--shadow)}
.dirty-dot{width:8px;height:8px;border-radius:50%;background:var(--redline)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);z-index:85;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;transform:translateX(102%);visibility:hidden;transition:transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s .45s;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:none;visibility:visible;transition:transform .45s cubic-bezier(.2,.8,.2,1);box-shadow:-30px 0 60px -30px rgba(0,0,0,.35)}
.d-head{padding:16px 18px 0;display:grid;gap:12px}
.d-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.d-top h2{margin:0;font-family:var(--display);font-size:20px;letter-spacing:-.01em}
.d-top p{margin:0;color:var(--muted);font-size:13px}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 12px;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.d-body{flex:1;overflow-y:auto;padding:18px;display:grid;gap:14px;align-content:start}
.d-foot{border-top:1px solid var(--line);padding:12px 18px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface)}
.d-foot .note{font-size:12px;color:var(--muted);font-family:var(--mono)}
.fld{display:grid;gap:6px;align-content:start}
.fld>span{font-size:13px;font-weight:500}
.fld small{color:var(--muted);font-size:12px}
.drop{position:relative;border:1.5px dashed color-mix(in oklab,var(--ink) 25%,transparent);border-radius:12px;padding:22px 16px;display:grid;justify-items:center;gap:4px;text-align:center;color:var(--muted);font-size:13px;background:var(--surface-2);transition:border-color .2s,background .2s}
.drop b{color:var(--ink);font-size:15px}
.drop svg{width:22px;height:22px;color:var(--accent);margin-bottom:4px}
.drop.sm{padding:12px;grid-template-columns:auto;font-size:12px}
.drop.sm b{font-size:13px}
.drop.over,.drop:hover{border-color:var(--accent);background:color-mix(in oklab,var(--accent) 7%,var(--surface-2))}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.dsec{font-family:var(--display);font-size:17px;letter-spacing:-.01em;margin:10px 0 0;padding-top:14px;border-top:1px solid var(--line)}
.dsec small{display:block;font-family:var(--body);font-size:12px;color:var(--muted);font-weight:400;letter-spacing:0}
.ilist{display:grid;gap:8px}
.irow{display:grid;grid-template-columns:88px minmax(0,1fr);gap:10px;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:10px;padding:8px}
.irow .t{width:88px;height:64px;border-radius:6px;background:var(--canvas) center/cover no-repeat;border:1px solid var(--line-soft)}
.irow .c{display:grid;gap:6px;min-width:0}
.irow .a{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.irow select{width:auto!important;padding:5px 8px!important;font-size:13px!important}
.note.warn{color:#D93025}
.fld input[type=text],.fld input[type=url],.fld textarea,.fld select,.irow input[type=text],.irow select{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;line-height:1.5}
.fld textarea{resize:vertical;min-height:84px}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 20%,transparent)}
.fld input[type=color]{width:44px;height:36px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--surface-2)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
@media (max-width:460px){.row2{grid-template-columns:1fr}}
.group{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:12px;background:var(--canvas)}
.group-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.group-h b{font-size:13px;font-family:var(--mono);color:var(--muted);font-weight:500}
.ib{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;min-width:32px;height:32px;padding:0 8px;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.ib:hover{border-color:var(--ink)}
.ib.danger{color:#D93025}
.ib.danger.armed{background:#D93025;color:#fff;border-color:#D93025}
.ib:disabled{opacity:.35;cursor:default}
.plist{display:grid;gap:8px}
.prow{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:12px;padding:8px}
.prow .th{width:40px;height:40px;border-radius:8px;background:var(--pc);overflow:hidden}
.prow .th img{width:100%;height:100%;object-fit:cover}
.prow b{display:block;font-size:14px;line-height:1.3}
.prow small{color:var(--muted);font-size:12px}
.prow .acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.prow.hid{opacity:.55}
.imgfld{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.imgfld .pv{width:84px;height:56px;border-radius:8px;border:1px solid var(--line);background:var(--canvas) center/cover no-repeat;flex:none}
.gal{display:flex;flex-wrap:wrap;gap:8px}
.gal div{position:relative;width:84px;height:56px;border-radius:8px;background:center/cover no-repeat;border:1px solid var(--line)}
.gal div button{position:absolute;right:-6px;top:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--ink);color:var(--canvas);cursor:pointer;font-size:12px;line-height:1}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.banner{background:color-mix(in oklab,var(--accent) 12%,var(--surface-2));border:1px solid color-mix(in oklab,var(--accent) 35%,transparent);border-radius:10px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--canvas);padding:10px 16px;border-radius:10px;font-size:14px;z-index:95;opacity:0;transition:all .3s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translateX(-50%)}
.hint{font-size:13px;color:var(--muted);margin:0}


/* designer notes */
.pinwrap{position:relative}
.pin{position:absolute;z-index:3;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50% 50% 50% 4px;border:2px solid #fff;background:var(--redline);color:#fff;font:600 12px/1 var(--body);display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:0 6px 16px -4px rgba(0,0,0,.45);transition:transform .2s}
.pin::after{content:"";position:absolute;inset:-6px;border-radius:inherit;border:2px solid var(--redline);opacity:0;animation:pinRing 2.6s ease-out infinite;animation-delay:var(--d,0ms)}
@keyframes pinRing{0%{opacity:.7;transform:scale(.8)}70%,100%{opacity:0;transform:scale(1.5)}}
.pin:hover,.pin.open,.pin:focus-visible{transform:scale(1.12);z-index:5}
@supports (animation-timeline:view()){.pin{animation:pinPop linear both;animation-timeline:view();animation-range:entry 30% entry 70%}}
@keyframes pinPop{from{transform:scale(.001)}to{transform:none}}
.pin-card{position:absolute;left:34px;top:-6px;width:min(260px,64vw);background:var(--surface-2);color:var(--ink);text-align:left;font:400 13px/1.5 var(--body);padding:10px 12px;border-radius:4px 12px 12px 12px;box-shadow:0 18px 40px -12px rgba(0,0,0,.45);border:1px solid var(--line-soft);opacity:0;visibility:hidden;transform:translateY(4px);transition:opacity .2s,transform .2s,visibility 0s .2s;pointer-events:none;white-space:normal}
.pin-card b{display:block;font:500 11px var(--mono);color:var(--redline);margin-bottom:3px;letter-spacing:.04em}
.pin.flip-x .pin-card{left:auto;right:34px;border-radius:12px 4px 12px 12px}
.pin.flip-y .pin-card{top:auto;bottom:-6px}
.pin:hover .pin-card,.pin.open .pin-card,.pin:focus-visible .pin-card{opacity:1;visibility:visible;transform:none;transition:opacity .2s,transform .2s}
.notes-off .pin{display:none}
.notes-toggle[aria-pressed="true"]{background:var(--redline);color:#fff;border-color:var(--redline)}
.notes-toggle .dot{width:8px;height:8px;border-radius:50%;background:var(--redline)}
.notes-toggle[aria-pressed="true"] .dot{background:#fff}
.notes-tip{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--muted);margin:-8px 0 24px}
.notes-tip .pin{position:static;margin:0;flex:none;animation:none;pointer-events:none;width:24px;height:24px;font-size:11px}
.notes-tip .pin::after{display:none}
.lb-notes{list-style:none;margin:8px auto 0;padding:0;display:grid;gap:4px;max-width:720px;text-align:left;font-size:13px}
.lb-notes li{display:flex;gap:8px}
.lb-notes li b{color:#ff8fac;font-family:var(--mono);font-weight:500}
/* note editor */
.ne{position:fixed;inset:0;z-index:96;background:var(--canvas);display:grid;grid-template-rows:auto minmax(0,1fr);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ne-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.ne-top b{font-family:var(--display);font-size:18px}
.ne-body{display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:0}
@media (max-width:800px){.ne-body{grid-template-columns:1fr;grid-template-rows:minmax(0,1.2fr) minmax(0,1fr)}}
.ne-img{overflow:auto;padding:24px;display:grid;place-items:start center}
.ne-wrap{position:relative;display:inline-block;cursor:crosshair;max-width:100%;touch-action:none}
.ne-wrap img{max-width:100%;max-height:calc(100vh - 140px);width:auto;border-radius:10px;border:1px solid var(--line);user-select:none;-webkit-user-drag:none}
.ne-wrap .pin{animation:none;cursor:grab}
.ne-wrap .pin::after{display:none}
.ne-wrap .pin.sel{outline:3px solid var(--accent);outline-offset:2px}
.ne-list{border-left:1px solid var(--line);background:var(--surface);overflow-y:auto;padding:16px;display:grid;gap:10px;align-content:start}
@media (max-width:800px){.ne-list{border-left:0;border-top:1px solid var(--line)}}
.ne-item{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:start}
.ne-item .num{width:24px;height:24px;border-radius:50% 50% 50% 4px;background:var(--redline);color:#fff;font:600 11px/24px var(--body);text-align:center}
.ne-item textarea{field-sizing:content;min-height:76px!important;width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical;min-height:60px}
.ne-item textarea:focus{outline:none;border-color:var(--accent)}

/* ===== Zizo ===== */
:root{--zzw:min(460px,36vw)}
body{transition:padding-right .45s cubic-bezier(.2,.8,.2,1)}
.zz-docked body{padding-right:var(--zzw)}
.zz-docked .cs{right:var(--zzw)}
.zz-docked .admin-fab{right:calc(var(--zzw) + 16px)}
.zz-docked .progress{right:var(--zzw)}
/* face */
.zz-face{--s:40px;position:relative;width:var(--s);height:var(--s);flex:none;border-radius:34% 34% 40% 40%;background:linear-gradient(145deg,#FFB547 0%,var(--redline) 55%,#8A4DFF 100%);box-shadow:inset 0 -3px 0 rgba(0,0,0,.14),0 6px 16px -6px rgba(242,56,106,.6)}
.zz-face::before{content:"";position:absolute;left:50%;top:-12%;width:10%;height:18%;margin-left:-5%;border-radius:40%;background:#FFB547;transform-origin:50% 100%;animation:zzAnt 3.4s ease-in-out infinite}
.zz-face::after{content:"";position:absolute;left:50%;top:-22%;width:18%;height:18%;margin-left:-9%;border-radius:50%;background:#FFE08A;box-shadow:0 0 8px #FFE08A}
@keyframes zzAnt{50%{transform:rotate(12deg)}}
.zz-eyes{position:absolute;left:18%;right:18%;top:30%;display:flex;justify-content:space-between}
.zz-eye{width:28%;aspect-ratio:1/1.15;background:#fff;border-radius:50%;position:relative;overflow:hidden;animation:zzBlink 5s infinite}
.zz-eye i{position:absolute;width:52%;height:52%;left:24%;top:24%;border-radius:50%;background:#16131F;transform:translate(var(--ex,0),var(--ey,0));transition:transform .15s}
@keyframes zzBlink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.zz-mouth{position:absolute;left:36%;right:36%;top:66%;height:14%;border:2.5px solid #fff;border-top:0;border-radius:0 0 999px 999px;transition:all .25s}
.zz-face[data-mood="think"] .zz-eye i{transform:translate(-18%,-30%)}
.zz-face[data-mood="think"] .zz-mouth{left:44%;right:44%;height:10%;border-radius:50%;border-top:2.5px solid #fff}
.zz-face[data-mood="think"]{animation:zzBob 1s ease-in-out infinite}
@keyframes zzBob{50%{transform:translateY(-2px) rotate(-3deg)}}
.zz-face[data-mood="happy"] .zz-eye{background:transparent;overflow:visible}
.zz-face[data-mood="happy"] .zz-eye::before{content:"";position:absolute;inset:20% 5% 35%;border:2.5px solid #fff;border-bottom:0;border-radius:999px 999px 0 0}
.zz-face[data-mood="happy"] .zz-eye i{display:none}
.zz-face[data-mood="happy"] .zz-mouth{height:22%;left:32%;right:32%;background:#fff}
.zz-face.wave{animation:zzWave 1.2s ease-in-out 2}
@keyframes zzWave{25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
/* launcher */
.zz-launch{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:78;display:inline-flex;align-items:center;gap:12px;padding:8px 18px 8px 8px;border-radius:999px;border:0;cursor:pointer;background:var(--ink);color:var(--canvas);font-weight:600;font-size:15px;box-shadow:0 18px 40px -14px rgba(0,0,0,.55);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.zz-launch.first{animation:zzIn .8s cubic-bezier(.2,.8,.2,1) 1.2s both}
.zz-launch>span{text-align:left;line-height:1.25}
.zz-launch small{display:block;font-weight:400;font-size:12px;opacity:.7;text-align:left}
.zz-launch:hover{transform:translateY(-3px) scale(1.02)}
@keyframes zzIn{from{opacity:0;transform:translateY(30px) scale(.8)}}
.zz-bubble{position:fixed;left:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:78;max-width:min(300px,calc(100vw - 32px));background:var(--surface-2);color:var(--ink);border:1px solid var(--line-soft);box-shadow:0 18px 40px -16px rgba(0,0,0,.35);border-radius:16px 16px 16px 4px;padding:12px 34px 12px 14px;font-size:14px;line-height:1.45;cursor:pointer;animation:zzPop .5s cubic-bezier(.2,1.4,.4,1) both}
.zz-bubble b{display:block;font-size:12px;color:var(--redline);font-family:var(--mono);font-weight:500;margin-bottom:2px}
.zz-bubble button{position:absolute;right:6px;top:6px;width:24px;height:24px;border-radius:6px;border:0;background:transparent;color:var(--muted);cursor:pointer}
@media (min-width:900px){.zz-bubble{left:228px;bottom:calc(20px + env(safe-area-inset-bottom,0px));border-radius:16px 16px 16px 4px}}
@keyframes zzPop{from{opacity:0;transform:translateY(12px) scale(.9)}}
/* nav ask */
.nav-ask{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:10px;padding:5px 10px 5px 6px;font-size:14px;font-weight:500;cursor:pointer;transition:border-color .2s,box-shadow .2s}
.nav-ask:hover{border-color:var(--redline);box-shadow:0 0 0 3px color-mix(in oklab,var(--redline) 15%,transparent)}
.nav-ask .zz-face{--s:24px;box-shadow:none}
.nav-ask .zz-face::before,.nav-ask .zz-face::after{display:none}
.nav-right{display:flex;gap:8px;align-items:center}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--muted);background:var(--surface)}
@media (max-width:640px){.nav-ask kbd,.nav-ask .lbl{display:none}}
/* hero ask bar */
.lede.after-ask{margin-top:28px}
.zz-ask{position:relative;margin-top:60px;max-width:680px;display:flex;align-items:center;gap:12px;background:var(--surface-2);border:1.5px solid var(--line);border-radius:18px;padding:10px 10px 10px 12px;box-shadow:0 20px 50px -24px rgba(16,18,24,.35);transition:border-color .25s,box-shadow .25s}
.zz-ask::before{content:"";position:absolute;inset:-1.5px;border-radius:inherit;padding:1.5px;background:conic-gradient(from var(--ang,0deg),#FFB547,var(--redline),#8A4DFF,var(--accent),#FFB547);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:zzSpin 5s linear infinite;opacity:.9;pointer-events:none}
@property --ang{syntax:"<angle>";initial-value:0deg;inherits:false}
@keyframes zzSpin{to{--ang:360deg}}
.zz-ask:focus-within{box-shadow:0 0 0 4px color-mix(in oklab,var(--redline) 16%,transparent),0 20px 50px -24px rgba(16,18,24,.35)}
.zz-ask .zz-face{--s:38px}
.zz-ask input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;color:var(--ink);padding:8px 0}
.zz-ask input:focus{outline:none}
.zz-ask input::placeholder{color:var(--muted)}
.zz-ask button{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:12px;background:var(--ink);color:var(--canvas);font-weight:600;font-size:14px;padding:11px 16px;cursor:pointer;white-space:nowrap}
.zz-ask button svg{width:16px;height:16px}
.zz-ask-hint{margin-top:8px;font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.zz-ask-hint button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--ink);cursor:pointer}
.zz-ask-hint button:hover{border-color:var(--redline)}
@media (max-width:520px){.zz-ask .go-lbl{display:none}.zz-ask button{padding:11px 12px}}
.zz-inline{display:inline-flex;align-items:center;gap:8px}
.zz-inline .zz-face{--s:22px;box-shadow:none}.zz-inline .zz-face::before,.zz-inline .zz-face::after{display:none}
.zz-callout{margin-top:40px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:space-between;border:1.5px dashed color-mix(in oklab,var(--redline) 45%,transparent);border-radius:18px;padding:18px 20px;background:color-mix(in oklab,var(--redline) 5%,var(--surface))}
.zz-callout .zz-face{--s:44px}
.zz-callout p{margin:0;flex:1;min-width:200px}
.zz-callout b{font-family:var(--display);font-size:19px;display:block}
/* panel */
.zz{position:fixed;top:0;right:0;bottom:0;width:var(--zzw);z-index:84;background:var(--surface);border-left:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:zzSlide .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes zzSlide{from{transform:translateX(100%)}}
.zz.full{width:100%;left:0;border-left:0}
.zz.full .zz-col{max-width:780px;margin:0 auto;width:100%}
@media (max-width:1023px){.zz{width:100%;left:0;border-left:0}}
.zz-head{display:flex;align-items:center;gap:6px;padding:12px 12px 12px 16px;border-bottom:1px solid var(--line-soft)}
.zz-head .t{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.zz-head .t .zz-face{--s:30px;box-shadow:none}.zz-head .t .zz-face::before,.zz-head .t .zz-face::after{display:none}
.zz-head b{display:block;font-size:15px}
.zz-head small{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zz-head small i{width:7px;height:7px;border-radius:50%;background:#1DB36B;flex:none}
.zz-head small i.off{background:var(--muted)}
.zz-ib{width:34px;height:34px;border-radius:9px;border:0;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.zz-ib:hover{background:var(--line-soft);color:var(--ink)}
.zz-ib svg{width:18px;height:18px}
.zz-body{overflow-y:auto;overscroll-behavior:contain;padding:20px 18px}
.zz-col{display:flex;flex-direction:column;gap:12px}
.zz-welcome{display:flex;flex-direction:column;gap:18px;padding-top:clamp(12px,8vh,90px)}
.zz-welcome .zz-face{--s:64px}
.zz-welcome h2{margin:0;font-family:var(--display);font-weight:720;font-size:clamp(30px,3.2vw,44px);letter-spacing:-.03em;line-height:1.05}
.zz-welcome h2 span{display:block;color:var(--muted);font-weight:600}
.zz-welcome p{margin:0;color:var(--muted);font-size:15px;max-width:44ch}
.zz-cta{align-self:flex-start;border:1.5px solid var(--accent);color:var(--accent);background:transparent;border-radius:10px;padding:10px 16px;font-weight:600;font-size:15px;cursor:pointer}
.zz-cta:hover{background:color-mix(in oklab,var(--accent) 8%,transparent)}
.zz-sec{font-size:13px;color:var(--muted);margin:6px 0 -4px}
.zz-list{display:grid;gap:2px}
.zz-list button{display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:9px 8px;border-radius:9px;font-size:14.5px;color:var(--ink);cursor:pointer}
.zz-list button:hover{background:var(--line-soft)}
.zz-list button svg{width:16px;height:16px;color:var(--muted);flex:none}
.zz-list button .when{margin-left:auto;color:var(--muted);font-size:12.5px;white-space:nowrap}
.zz-list button .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zz-chips{display:flex;flex-wrap:wrap;gap:6px}
.zz-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer;text-decoration:none;transition:border-color .2s,background .2s;text-align:left}
.zz-chip:hover{border-color:var(--accent);background:color-mix(in oklab,var(--accent) 7%,var(--surface-2))}
.zz-chip.proj::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--pc,var(--accent))}
.zz-chip.cta{background:var(--ink);color:var(--canvas);border-color:var(--ink)}
.zz-row{display:flex;gap:10px;align-items:flex-start}
.zz-row.me{justify-content:flex-end}
.zz-row .zz-face{--s:28px;margin-top:2px;box-shadow:none}.zz-row .zz-face::before,.zz-row .zz-face::after{display:none}
.zz-msg{max-width:86%;font-size:14.5px;line-height:1.58;padding:10px 13px;border-radius:14px;word-wrap:break-word;animation:zzMsg .3s ease both}
@keyframes zzMsg{from{opacity:0;transform:translateY(6px)}}
.zz-msg.from-z{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:4px 14px 14px 14px}
.zz-msg.from-u{background:var(--accent);color:var(--accent-ink);border-radius:14px 4px 14px 14px;white-space:pre-wrap}
.zz-msg.from-u.long{max-height:140px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.zz-msg p{margin:0 0 8px}.zz-msg p:last-child{margin:0}
.zz-msg ul{margin:4px 0 8px;padding-left:18px;display:grid;gap:4px}
.zz-msg .err{color:#D93025;font-size:13px;margin-top:6px}
.zz-msg .zz-chip{margin:2px 2px 2px 0;vertical-align:middle}
.zz-typing{display:inline-flex;gap:4px;padding:4px 0}
.zz-typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.zz-typing i:nth-child(2){animation-delay:.2s}.zz-typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.zz-foot{padding:10px 14px 12px;display:grid;gap:8px}
.zz-box{border:1px solid var(--line);border-radius:16px;background:var(--surface-2);padding:10px 10px 10px 14px;display:grid;gap:8px;transition:border-color .2s,box-shadow .2s}
.zz-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 16%,transparent)}

.zz-box .bar{display:flex;align-items:center;gap:8px}
.zz-box .bar .mode{font-size:12.5px;color:var(--muted)}
.zz-send{margin-left:auto;width:38px;height:38px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;display:grid;place-items:center;flex:none}
